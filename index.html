        function getWinning(round) {
            const row = DATA.find(r => r[0] === round);
            return row ? { main: row.slice(1, 7), bonus: row[7] } : null;
        }

        function findSimilar(baseRound, startRound, minMatch, topN) {
            const prev = getWinning(baseRound - 1);
            if (!prev) return { similar: [], prevNums: [] };
            const baseNums = prev.main;
            const result = [];
            const winData = getWinning(baseRound);
            for (const row of DATA) {
                const r = row[0];
                if (r >= baseRound || r < startRound) continue;
                const nums = row.slice(1, 7);
                const matched = nums.filter(n => baseNums.includes(n));
                if (matched.length >= minMatch) {
                    const next = (r + 1 < baseRound) ? getWinning(r + 1) : null;
                    let winMatchCount = 0;
                    if (winData) winMatchCount = nums.filter(n => winData.main.includes(n)).length;
                    result.push({
                        round: r, nums, bonus: row[7], matched, matchCount: matched.length,
                        nextNums: next ? next.main : [], nextBonus: next ? next.bonus : null,
                        winMatchCount
                    });
                }
            }
            result.sort((a, b) => b.winMatchCount - a.winMatchCount || b.matchCount - a.matchCount);
            return { similar: result.slice(0, topN), prevNums: baseNums };
        }

        function calcFreq(similar) {
            const f = {};
            for (let i = 1; i <= 45; i++) f[i] = 0;
            for (const s of similar) {
                for (const n of s.nextNums) f[n] = (f[n] || 0) + 1;
                if (s.nextBonus !== null) f[s.nextBonus] = (f[s.nextBonus] || 0) + 1;
                for (const n of s.nums) f[n] = (f[n] || 0) + 1;
                if (s.bonus !== null) f[s.bonus] = (f[s.bonus] || 0) + 1;

            return f;

            const sorted = [...pool].sort((a,b) => (globalFreqData[b]||0) - (globalFreqData[a]||0) || a - b);
            const combos = [], seen = new Set();
            for (let i = 0; i < 10; i++) {

                for (let j = 0; j < 6; j++) combo.push(sorted[(i + j) % n]);
                combo.sort((a,b)=>a-b);
                const key = combo.join(',');
                if (!seen.has(key)) { seen.add(key); combos.push(combo); }
            }
            while (combos.length < 10) combos.push([...combos[combos.length - 1]]);

        // ========================================================================
        // 7. 9수 내부 순위 매기기 (Tier 시스템 - 1수용)
        // ========================================================================
        function getRankedNine() {
            if (!lastTop9 || lastTop9.length === 0) return [];
            const topPredNums = lastTopPred.map(p => p.num);
            const mustInclude = [1, 15, 31];
            
            let tier1=[], tier2=[], tier3=[], tier4=[], tier5=[];
            
            lastTop9.forEach(n => {
                const isInter = globalIntersectionMap[n] || false;
                const isTop10 = topPredNums.includes(n);
                const isMust = mustInclude.includes(n);
                
                if (isMust && isInter) tier1.push(n);
                else if (isInter && isTop10) tier2.push(n);
                else if (isInter) tier3.push(n);
                else if (isTop10) tier4.push(n);
                else tier5.push(n);
            });
            
            // Tier 내부 정렬: 통합 점수 + 빈도
            const sortFn = (arr) => arr.sort((a,b) => {
                const sa = getUnifiedScore(a);
                const sb = getUnifiedScore(b);
                if (sa !== sb) return sb - sa;
                if (globalIntersectionMap[a] && !globalIntersectionMap[b]) return -1;
                if (!globalIntersectionMap[a] && globalIntersectionMap[b]) return 1;
                return (globalFreqData[b] || 0) - (globalFreqData[a] || 0) || a - b;
            });
            sortFn(tier1); sortFn(tier2); sortFn(tier3); sortFn(tier4); sortFn(tier5);
            
            return [...tier1, ...tier2, ...tier3, ...tier4, ...tier5];
        }

                if (candidates.length === 0) return ranked[0];

        // ========================================================================
        // 10. 백테스트 (1수 당첨위치)
        // ========================================================================
        function backtestWinnerPosition() {
            const base = parseInt(document.getElementById('baseRound').value) || 1234;
            const start = parseInt(document.getElementById('startRound').value) || 1000;
            const min = parseInt(document.getElementById('minMatch').value) || 2;
            const topN = parseInt(document.getElementById('topCount').value) || 6;
            let hitPositions = [0,0,0,0,0,0,0,0,0];
            let totalRounds = 0;
            
            for (let r = start; r < base; r++) {
                const realWin = getWinning(r);
                if (!realWin) continue;
                
                const tempResult = findSimilar(r, start, min, topN);
                if (tempResult.similar.length === 0) continue;
                
                const tempSim = tempResult.similar;
                const tempBaseNums = tempResult.prevNums;
                const tempFreq = calcFreq(tempSim);
                const tempWinData = getWinning(r);
                const tempTopCandidates = tempSim.slice(0, topN);
                
                const tempTopAll = [];
                for (const s of tempTopCandidates) {
                    const allNums = [...s.nums];
                    if (s.bonus !== null) allNums.push(s.bonus);
                    for (const n of allNums) tempTopAll.push(n);
                }
                const tempTopNumsAll = [...new Set(tempTopAll)].sort((a,b)=>a-b);
                
                const tempTopFreq = {};
                for (const n of tempTopAll) tempTopFreq[n] = (tempTopFreq[n] || 0) + 1;
                
                const tempBonusSet = new Set(), tempNextBonusSet = new Set();
                for (const s of tempSim) {
                    if (s.bonus !== null) tempBonusSet.add(s.bonus);
                    if (s.nextBonus !== null) tempNextBonusSet.add(s.nextBonus);
                }
                const tempBonusInter = [...tempBonusSet].filter(n => tempNextBonusSet.has(n)).sort((a,b)=>a-b);
                
                const tempTopNextAll = [];
                for (const s of tempTopCandidates) {
                    if (s.round + 1 < r && s.nextNums.length > 0) {
                        const allNext = [...s.nextNums];
                        if (s.nextBonus !== null) allNext.push(s.nextBonus);
                        for (const n of allNext) tempTopNextAll.push(n);
                    }
                }
                const tempTopNextFreq = {};
                for (const n of tempTopNextAll) tempTopNextFreq[n] = (tempTopNextFreq[n] || 0) + 1;
                
                const tempPredScore = {}, tempPredCount = {};
                for (const s of tempSim) {
                    if (!(s.round + 1 < r && s.nextNums.length > 0)) continue;
                    const weight = s.matchCount;
                    for (const n of s.nextNums) {
                        tempPredCount[n] = (tempPredCount[n] || 0) + 1;
                        let score = weight;
                        if (tempFreq[n]) score += tempFreq[n] * 0.8;
                        if (tempBonusInter.includes(n)) score += 2.0;
                        tempPredScore[n] = (tempPredScore[n] || 0) + score;
                    }
                }
                const tempTopPred = Object.entries(tempPredScore)
                    .sort((a,b) => b[1] - a[1])
                    .slice(0, 10)
                    .map(([num, score]) => ({ num: parseInt(num), score: Math.round(score * 10) / 10, count: tempPredCount[num] || 0 }));
                const tempTopPredNums = tempTopPred.map(item => item.num);
                
                const tempBasePool = Object.keys(tempTopFreq).filter(k => tempTopFreq[k] >= 2).map(Number);
                const tempOneHit = Object.keys(tempTopFreq).filter(k => tempTopFreq[k] === 1).map(Number);
                const tempScoredOne = tempOneHit.map(n => {
                    let score = 0;
                    if (tempBonusInter.includes(n)) score += 3;
                    if (tempTopPredNums.includes(n)) score += 2;
                    if (tempTopNextFreq[n] > 0) score += 1;
                    if (tempFreq[n] >= 5) score += 1;
                    return { num: n, score };
                });
                tempScoredOne.sort((a,b) => b.score - a.score);
                const tempMaxAdd = Math.min(topN, 10);
                const tempTarget = Math.min(20, tempBasePool.length + tempMaxAdd);
                let tempFinalPool = [...tempBasePool];
                for (const item of tempScoredOne) {
                    if (tempFinalPool.length >= tempTarget) break;
                    if (!tempFinalPool.includes(item.num)) tempFinalPool.push(item.num);
                }
                tempFinalPool.sort((a,b) => (tempFreq[b]||0) - (tempFreq[a]||0));
                const tempActiveFreq2 = tempFinalPool;
                const tempOldNextFreq2 = Object.keys(tempTopNextFreq).filter(k => tempTopNextFreq[k] >= 2).map(Number).sort((a,b)=>a-b);
                const tempInterMap = {};
                const tempInter = tempActiveFreq2.filter(n => tempOldNextFreq2.includes(n));
                for (const n of tempInter) tempInterMap[n] = true;
                
                const exGroup = tempActiveFreq2.filter(n => !tempTopPredNums.includes(n));
                const mustInclude = [1, 15, 31];
                const mustInc = mustInclude.filter(n => exGroup.includes(n));
                let restEx = exGroup.filter(n => !mustInc.includes(n));
                restEx.sort((a,b) => (tempFreq[b]||0) - (tempFreq[a]||0) || b - a);
                let top9 = [...mustInc];
                top9 = top9.concat(restEx.slice(0, 6 - mustInc.length));
                let interGrp = tempActiveFreq2.filter(n => tempTopPredNums.includes(n));
                interGrp.sort((a,b) => (tempFreq[b]||0) - (tempFreq[a]||0) || b - a);
                top9 = top9.concat(interGrp.slice(0, 3));
                if (top9.length < 9) {
                    const rest = tempActiveFreq2.filter(n => !top9.includes(n));
                    rest.sort((a,b) => (tempFreq[b]||0) - (tempFreq[a]||0) || b - a);
                    top9 = top9.concat(rest.slice(0, 9 - top9.length));
                }
                top9 = [...new Set(top9)];
                
                let found = false;
                for (let i = 0; i < top9.length; i++) {
                    if (realWin.main.includes(top9[i])) {
                        hitPositions[i]++;
                        found = true;
                        break;
                    }
                }
                if (found) totalRounds++;
            }
            
            let html = document.getElementById('resultArea').innerHTML || '';
            html += `<div class="backtest-result">
                <h3 style="color:#8e44ad; margin-bottom:15px;">🔍 1수 당첨위치 백테스트 (${start}~${base-1}회)</h3>
                <p style="color:#aaa; margin-bottom:10px;">📌 총 ${totalRounds}회에서 9수 내 본번호가 발견됨</p>
                <table>
                    <tr><th>9수 내 위치</th><th>적중 횟수</th><th>비율</th><th>막대</th></tr>`;
            const maxVal = Math.max(...hitPositions, 1);
            for (let i = 0; i < 9; i++) {
                const pct = totalRounds > 0 ? (hitPositions[i] / totalRounds * 100) : 0;
                const barWidth = (hitPositions[i] / maxVal * 100);
                const isBest = hitPositions[i] === Math.max(...hitPositions);
                html += `<tr>
                    <td><strong>${i+1}번째</strong> ${isBest ? '⭐' : ''}</td>
                    <td>${hitPositions[i]}회</td>
                    <td>${pct.toFixed(1)}%</td>
                    <td><div style="background:#333; width:150px; height:16px; border-radius:8px; overflow:hidden; display:inline-block;">
                        <div style="background:${isBest?'#2ecc71':'#8e44ad'}; width:${barWidth}%; height:100%;"></div>
                    </div></td>
                </tr>`;
            }
            html += `</table>
                <div style="margin-top:15px; padding:10px; background:#222; border-radius:8px; text-align:center; font-size:16px; color:#ffd700;">
                    🏆 가장 많이 당첨된 위치: <span class="highlight-rank">${hitPositions.indexOf(Math.max(...hitPositions)) + 1}번째</span> (${Math.max(...hitPositions)}회 / ${totalRounds > 0 ? (Math.max(...hitPositions)/totalRounds*100).toFixed(1) : 0}%)
                </div>
                <div style="margin-top:10px; font-size:12px; color:#888;">💡 이 통계는 과거 데이터 기반으로, 미래를 보장하지 않습니다.</div>
            </div>`;
            document.getElementById('resultArea').innerHTML = html;
        }

        // ========================================================================
        // 11. 조합 생성기들
        // ========================================================================
        function generateGungHapCombos() {
            if (!similarData) { alert('분석 실행 먼저'); return; }
            const unionSet = new Set([...activeFreq2, ...oldNextFreq2]);
            let P = topNumsAll.filter(n => unionSet.has(n));
            const strong5 = (() => {
                const must = [1,15,31].filter(n => lastTop9.includes(n));
                const rest = lastTop9.filter(n => !must.includes(n));
                rest.sort((a,b) => getUnifiedScore(b) - getUnifiedScore(a) || b - a);
                return must.concat(rest.slice(0, 5 - must.length));
            })();
            if (strong5.length < 2 || P.length < 6) { alert('풀 부족'); return; }
            const rest = P.filter(n => !strong5.includes(n));
            const pairs = [];
            for (let i=0; i<strong5.length; i++) for (let j=i+1; j<strong5.length; j++) pairs.push([strong5[i], strong5[j]]);
            const combos = [], used = new Set();
            for (let idx=0; idx<Math.min(pairs.length,10); idx++) {
                const combo = [...pairs[idx]];
                for (let k=0; k<4; k++) combo.push(rest[(idx+k)%rest.length]);
                combo.sort((a,b)=>a-b);
                const key=combo.join(',');
                if (!used.has(key)) { used.add(key); combos.push(combo); }
            }
            let html = document.getElementById('resultArea').innerHTML || '';
            html += `<div class="section-title">🧩 강력5수 포함 궁합수 조합</div>`;
            combos.slice(0,10).forEach((c,i) => {
                const display = c.map(n => {
                    let cls='', mark='';
                    if (winData && winData.main.includes(n)) { cls='match-hit'; mark='★'; }
                    else if (winData && n === winData.bonus) { cls='match-bonus'; mark='☆'; }
                    if (strong5.includes(n)) return `<span class="${cls}" style="border:2px solid #e74c3c; border-radius:20px; padding:2px 10px;">${n}${mark}<span class="strong5-tag">🔥</span></span>`;
                    return `<span class="${cls}">${n}${mark}</span>`;
                }).join(' ');
                html += `<div class="combo-box">#${i+1}: ${display}</div>`;
            });
            document.getElementById('resultArea').innerHTML = html;
        }

        function generateTop5Combos() {
            if (activeFreq2.length < 6) { alert('③번 풀이 6개 미만'); return; }
            const combos = makeCombos(activeFreq2);
            let html = document.getElementById('resultArea').innerHTML || '';
            html += `<div class="section-title">🔮 상위6 동반수 조합</div>`;
            combos.slice(0,10).forEach((c,i) => {
                const display = c.map(n => {
                    let cls='', mark='';
                    if (winData && winData.main.includes(n)) { cls='match-hit'; mark='★'; }
                    else if (winData && n === winData.bonus) { cls='match-bonus'; mark='☆'; }
                    if (globalIntersectionMap[n]) cls += ' intersection-highlight';
                    return `<span class="${cls}">${n}${mark}</span>`;
                }).join(' ');
                html += `<div class="combo-box">#${i+1}: ${display}</div>`;
            });
            document.getElementById('resultArea').innerHTML = html;
        }

        function resetAll() {
            document.getElementById('resultArea').innerHTML = '<div class="loading">분석 결과가 여기에 표시됩니다.</div>';
            similarData = null; winData = null; activeFreq2 = []; oldNextFreq2 = []; globalFreqData = {};
            topNumsAll = []; lastTopPred = []; lastBonusIntersection = []; lastTop9 = []; globalIntersectionMap = {};
        }

        document.getElementById('topCount').addEventListener('input', function() {
            document.getElementById('topCountDisplay').textContent = this.value;
        });

        window.onload = function() {
            document.getElementById('baseRound').value = 1234;
            document.getElementById('topCount').value = 6;
            document.getElementById('topCountDisplay').textContent = 6;
            runAnalysis();
        };
    </script>
