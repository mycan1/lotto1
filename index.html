        .log-box { background: #0d0d0d; border: 1px solid #555; border-radius: 10px; padding: 10px 15px; margin-bottom: 20px; max-height: 300px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; color: #ccc; }

        .group-inter { background: #2a1a2a; color: #ffb3b3; border: 1px solid #e74c3c; }

        .rank-2 { color: #c0c0c0; }

        .modal-box { background: #1a1a1a; border: 2px solid #ffd700; border-radius: 15px; max-width: 95%; max-height: 90%; width: 1300px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 50px rgba(255, 215, 0, 0.3); }
        .modal-header { background: #2a2a2a; padding: 15px 20px; border-bottom: 2px solid #ffd700; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }

        .modal-body .range-selector label { color: #ffd700; font-weight: bold; margin-right: 5px; }
        .modal-body .range-selector input { background: #2a2a2a; border: 1px solid #555; color: #fff; padding: 5px 10px; border-radius: 6px; width: 100px; }
        .modal-body .range-selector button { background: #00b894; color: #fff; border: none; padding: 6px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .modal-body .range-selector button:hover { background: #00a381; }
        .modal-body table { width: 100%; min-width: 1100px; border-collapse: collapse; font-size: 12px; }
        .modal-body th { background: #333; color: #ffd700; padding: 6px 4px; text-align: center; border: 1px solid #555; position: sticky; top: 0; z-index: 10; white-space: nowrap; }
        .modal-body td { padding: 4px 6px; text-align: center; border: 1px solid #444; color: #ddd; font-size: 12px; white-space: nowrap; }

        .modal-body .bonus-cell { color: #ff6b6b; font-weight: bold; }

        .modal-body .summary-item { background: #1a1a1a; padding: 10px; border-radius: 8px; text-align: center; border-left: 4px solid #ffd700; }
        .modal-body .summary-item .value { font-size: 24px; font-weight: bold; color: #ffd700; }
        .modal-body .summary-item .label { font-size: 12px; color: #aaa; }
        .modal-body .num9-compact { font-size: 13px; letter-spacing: 0.5px; }
        .modal-body .num9-compact .hit-num { color: #2ecc71; font-weight: bold; }
        .modal-body .num9-compact .bonus-num { color: #ff6b6b; font-weight: bold; }
        .color-green { color: #2ecc71; font-weight: bold; }
        .color-red { color: #ff6b6b; font-weight: bold; }

        .strategy-badge { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .strategy-9 { background: #1a3a1a; color: #2ecc71; border: 1px solid #2ecc71; }
        .strategy-6 { background: #3a2a1a; color: #f1c40f; border: 1px solid #f1c40f; }

<body>
    <h1>📊 통합 9수/1수/5수 시스템 + 적응형 전략</h1>
    <div class="update-notice">
        ✅ <strong>2026.07.25 1234회</strong> 당첨번호 반영 완료!<br>
        🔄 <strong>타깃 누출(Target Leakage) 완전 제거</strong> (방화벽 내장)<br>
        ✅ <strong>보너스 번호 활용</strong> (본1+보너스1 = 2점 처리)<br>
        ✅ <strong>정렬 방식 선택</strong> (많이 포함/적게 포함)<br>
        ✅ <strong>최소 일치 1개 옵션 추가</strong>
    </div>
    <div class="filters">
        <div class="filter-group">
            <label>📅 기준 회차 (종료)</label>
            <input type="number" id="baseRound" value="1234" min="2" max="1235">
        </div>
        <div class="filter-group">
            <label>🔢 시작 회차</label>
            <input type="number" id="startRound" value="1000" min="1" max="1234">
        </div>
        <div class="filter-group">
            <label>🎯 최소 일치</label>
            <select id="minMatch">
                <option value="1">1개</option>
                <option value="2" selected>2개</option>
                <option value="3">3개</option>
                <option value="4">4개</option>
                <option value="5">5개</option>
            </select>
        </div>
        <div class="filter-group">
            <label>📊 유사회차 정렬</label>
            <select id="similarSort">
                <option value="high" selected>많이 포함 (추세)</option>
                <option value="low">적게 포함 (역발상)</option>
            </select>
        </div>
        <div class="filter-group">
            <label>📊 9수 유사회차 개수</label>
            <div class="range-container">
                <input type="range" id="topCount" min="3" max="20" value="6" step="1">
                <span class="range-value" id="topCountDisplay">6</span>
                <span class="range-label">개</span>
            </div>
        </div>
        <div class="filter-group">
            <label>📊 1수 유사회차 개수</label>
            <div class="range-container">
                <input type="range" id="topCountOne" min="3" max="10" value="3" step="1">
                <span class="range-value" id="topCountOneDisplay">3</span>
                <span class="range-label">개</span>
            </div>
        </div>
        <div class="filter-group">
            <label>&nbsp;</label>
            <div class="btn-group">
                <button onclick="runAnalysis()">🚀 분석 실행 (9수용)</button>
                <button onclick="recommendStrong1()" class="strong-btn">💪 강력 1수 (3개)</button>
                <button onclick="recommendStrong5()" class="strong-btn" style="background:#e67e22;">💪 강력 5수 (데이터)</button>
                <button onclick="generateGungHapCombos()" class="gunghap-btn">🧩 강력1+5 조합 (6수)</button>
                <button onclick="optimizeNine()" class="optimize-btn">🎯 9수 압축 (합집합)</button>
                <button onclick="runHybrid()" class="hybrid-btn">🤝 하이브리드 10조합</button>
                <button onclick="runResidualAnalysis()" class="residual-btn">📋 잔여 풀 참고</button>
                <button onclick="openBacktestModal()" class="backtest-btn">📊 회차별 자동 테스트 (팝업)</button>
                <button onclick="resetAll()" class="secondary">🗑️ 초기화</button>
            </div>
        </div>
        <div class="filter-group" style="flex-basis:100%; border-top:1px solid #333; padding-top:10px; margin-top:5px;">
            <label>🔍 수동 테스트 회차</label>
            <div style="display:flex; gap:10px; align-items:center;">
                <input type="number" id="manualRound" value="1234" min="1" max="1235" style="width:120px; padding:6px 12px; border-radius:8px; border:1px solid #555; background:#2a2a2a; color:#fff; font-size:14px;">
                <button onclick="runManualTest()" class="strong-btn" style="background:#3498db; padding:8px 25px;">🔍 테스트 실행</button>
                <span style="color:#888; font-size:12px;">※ 특정 회차만 빠르게 분석 (전역 변수 갱신됨)</span>
            </div>
        </div>
    </div>
    <div class="result-area" id="resultArea"><div class="loading">분석 결과가 여기에 표시됩니다.</div></div>

    <!-- 백테스트 모달 -->
    <div class="modal-overlay" id="backtestModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2>📊 회차별 자동 백테스트 (방화벽 내장)</h2>
                <button class="close-btn" onclick="document.getElementById('backtestModal').classList.remove('active')">✕</button>
            </div>
            <div class="modal-body" id="backtestBody">
                <div class="range-selector">
                    <div>
                        <label>시작 회차:</label>
                        <input type="number" id="btStartRound" value="1000" min="1">
                    </div>
                    <div>
                        <label>종료 회차:</label>
                        <input type="number" id="btEndRound" value="1234" min="2">
                    </div>
                    <button onclick="runBacktest()">▶ 분석 실행</button>
                    <span style="color:#888; font-size:13px; margin-left:10px;">※ 기본값: 상단 필터 값</span>
                </div>
                <div id="backtestResult" style="text-align:center; padding:20px; color:#aaa;">⏳ 분석을 실행하려면 "분석 실행" 버튼을 누르세요.</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 🔒 방화벽 설정
        // ============================================================
        const STRICT_NO_LEAKAGE = true;
        const BONUS_WEIGHT = 0.5;

        // ============================================================
        // 1. DATA (1001~1234회)
        // ============================================================
        const DATA = [
            [1234,1,15,19,31,35,43,27],[1233,2,7,20,25,37,40,29],[1232,12,15,19,22,24,36,3],[1231,4,13,14,18,31,38,15],

                var matchCount = matched.length;

                    result.push({

                        nums: nums.slice(),
                        bonus: bonus,
                        matched: matched.slice(),
                        matchCount: matchCount,
                        nextNums: next ? next.main.slice() : [],

            for (var i9 = 0; i9 < finalPool.length; i9++) {
                var n9 = finalPool[i9];
                var isInter = tInterMap[n9] || false;
                var isTop10 = topPredNums.indexOf(n9) !== -1;
                if (isInter && isTop10) tierMap[1].push(n9);
                else if (isInter) tierMap[2].push(n9);
                else if (isTop10) tierMap[3].push(n9);
                else tierMap[4].push(n9);
            }
            var scoreFn = function(n) {
                var s = (freq[n] || 0) * 2;
                if (tInterMap[n]) s += 20;
                if (topPredNums.indexOf(n) !== -1) s += 10;
                return s;
            };
            for (var t=1; t<=4; t++) {
                tierMap[t].sort(function(a,b){ return scoreFn(b) - scoreFn(a) || a - b; });
            }
            var ranked = tierMap[1].concat(tierMap[2]).concat(tierMap[3]).concat(tierMap[4]);

            return {
                ranked: ranked,
                freq: freq,
                topPredNums: topPredNums,
                winData: winData,
                topN: topN,
                finalPool: finalPool,
                tInter: tInter
            };
        }
