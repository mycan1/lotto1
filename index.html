    function findSimilar(baseRound, startRound, minMatch, topN, offset = -1) {
        const refRound = baseRound + offset;
        const prev = getWinning(refRound);
        if (!prev) return { similar: [], prevNums: [] };
        const baseNums = prev.main, baseBonus = prev.bonus;
        const result = [], excludeBonus = isBonusExcluded();
        const sortMode = document.getElementById('similarSort')?.value || 'high';
        for (const row of DATA) {
            const r = row[0];
            if (r >= baseRound || r < startRound) continue;
            const nums = row.slice(1, 7), bonus = row[7];
            let matchCount = nums.filter(n => baseNums.includes(n)).length;
            if (!excludeBonus && bonus === baseBonus) matchCount += 1;
            if (matchCount < minMatch || matchCount > 6) continue;
            const next = (r + 1 < baseRound) ? getWinning(r + 1) : null;
            const nextFiltered = next ? next.main.filter(n => !baseNums.includes(n)) : [];
            const nextBonusFiltered = (next && next.bonus !== null && !baseNums.includes(next.bonus)) ? next.bonus : null;
            result.push({ round: r, remainedNums: nums.filter(n => !baseNums.includes(n)), bonus, matchCount, nextNums: nextFiltered, nextBonus: nextBonusFiltered });
        }
        result.sort((a, b) => {
            if (sortMode === 'low') return a.matchCount - b.matchCount || b.round - a.round;
            return b.matchCount - a.matchCount || b.round - a.round;
        });
        return { similar: result.slice(0, topN), prevNums: baseNums };
    }

    function calcFreq(similarResults) {
        const freq = {}, excludeBonus = isBonusExcluded();
        similarResults.forEach(s => {
            s.nextNums.forEach(n => freq[n] = (freq[n] || 0) + 1);
            if (!excludeBonus && s.nextBonus !== null) freq[s.nextBonus] = (freq[s.nextBonus] || 0) + 0.5;
            s.remainedNums.forEach(n => freq[n] = (freq[n] || 0) + 0.5);
            if (!excludeBonus && s.bonus !== null) freq[s.bonus] = (freq[s.bonus] || 0) + 0.5;
        });
        return freq;
    }

    function getTop10FromPattern(baseRound, startRound, minMatch, topN = 30, excludeBonus, sortMode, offset = -1) {
        const refRound = baseRound + offset;
        const prev = getWinning(refRound);
        if (!prev) return [];
        const baseNums = prev.main, baseBonus = prev.bonus;
        const similarRounds = [];
        for (const row of DATA) {
            const r = row[0];
            if (r >= baseRound || r < startRound) continue;
            const nums = row.slice(1, 7), bonus = row[7];
            let matchCount = nums.filter(n => baseNums.includes(n)).length;
            if (!excludeBonus && bonus === baseBonus) matchCount += 1;
            if (matchCount < minMatch || matchCount > 6) continue;
            similarRounds.push({ round: r, matchCount });
        }
        similarRounds.sort((a, b) => {
            if (sortMode === 'low') return a.matchCount - b.matchCount || b.round - a.round;
            return b.matchCount - a.matchCount || b.round - a.round;
        });
        const freqMap = {};
        for (const s of similarRounds.slice(0, topN)) {
            if (s.round + 1 >= baseRound) continue;
            const next = getWinning(s.round + 1);
            if (!next) continue;
            const recency = baseRound - s.round;
            let weight = recency <= 10 ? 1.5 : recency <= 20 ? 1.2 : 0.8;
            for (const n of next.main) freqMap[n] = (freqMap[n] || 0) + weight;
            if (next.bonus !== null && !excludeBonus) freqMap[next.bonus] = (freqMap[next.bonus] || 0) + weight * 0.8;
        }
        return Object.entries(freqMap).filter(([n, f]) => f >= minMatch).map(([n, f]) => ({ num: parseInt(n), score: Math.round(f*10)/10, freq: Math.round(f*10)/10 })).sort((a,b) => b.score - a.score || b.freq - a.freq).slice(0, 10);
    }

        return `<span style="color:${color}; font-weight:bold;">${n}${mark}</span>`;

    function recommendStrong5() {
        if (!lastTop9 || lastTop9.length === 0) { alert('⚠️ 먼저 "🚀 분석 실행"을 해주세요.'); return; }
        const base = parseInt(document.getElementById('baseRound').value) || 1235;
        const intersectSet = new Set(lastTop9.filter(n => lastV23Result.includes(n)));
        const unionSet = new Set([...lastTop9, ...lastV23Result]);
        const intersectEvens = [], intersectOdds = [];
        intersectSet.forEach(num => {
            const score = globalFreqData[num] || 0;
            if (num % 2 === 0) intersectEvens.push({ num, score });
            else intersectOdds.push({ num, score });
        });
        intersectEvens.sort((a,b) => b.score - a.score || a.num - b.num);
        intersectOdds.sort((a,b) => b.score - a.score || a.num - b.num);
        let selected = [];
        let evenPick = intersectEvens.slice(0, 3);
        let oddPick = intersectOdds.slice(0, 2);
        selected.push(...evenPick, ...oddPick);
        const remainingSet = new Set([...unionSet].filter(n => !intersectSet.has(n)));
        if (evenPick.length < 3) {
            const needed = 3 - evenPick.length;
            const remainingEvens = [];
            remainingSet.forEach(num => { if (num % 2 === 0) remainingEvens.push({ num, score: globalFreqData[num] || 0 }); });
            remainingEvens.sort((a,b) => b.score - a.score || a.num - b.num);
            selected.push(...remainingEvens.slice(0, needed));
        }
        if (oddPick.length < 2) {
            const needed = 2 - oddPick.length;
            const remainingOdds = [];
            remainingSet.forEach(num => { if (num % 2 === 1) remainingOdds.push({ num, score: globalFreqData[num] || 0 }); });
            remainingOdds.sort((a,b) => b.score - a.score || a.num - b.num);
            selected.push(...remainingOdds.slice(0, needed));
        }
        if (selected.length < 5) {
            const allCandidates = Array.from(unionSet).map(num => ({ num, score: globalFreqData[num] || 0 })).sort((a,b) => b.score - a.score || a.num - b.num);
            const existingNums = new Set(selected.map(item => item.num));
            for (const item of allCandidates) {
                if (selected.length >= 5) break;
                if (!existingNums.has(item.num)) { selected.push(item); existingNums.add(item.num); }
            }
        }
        const top5 = selected.slice(0,5).map(item => item.num);
        const winMain = winData ? winData.main : [], winBonus = winData ? winData.bonus : null;
        const hitMain = top5.filter(n => winMain.includes(n));
        const hitBonus = top5.filter(n => n === winBonus);
        const hitCount = hitMain.length + hitBonus.length;
        const evenCount = top5.filter(n => n % 2 === 0).length;
        const oddCount = top5.filter(n => n % 2 === 1).length;
        document.getElementById('resultArea').innerHTML += `
            <div class="strong5-result" style="border-color:#ffd700;background:#1a1a0a;">
                <div class="label" style="color:#ffd700;">💪 강력 5수 (${base}회 예상) - 교집합 내 짝3+홀2</div>
                <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0;">
                    ${top5.map(n => { const isHit = winMain.includes(n); const isBonus = n === winBonus; let color = '#fff', mark = ''; if (isHit) { color = '#2ecc71'; mark = '★'; } else if (isBonus) { color = '#ff6b6b'; mark = '☆'; } return `<span style="font-size:28px;font-weight:bold;color:${color};">${n}${mark}</span>`; }).join(' ')}
                </div>
                <div class="source">📌 짝${evenCount}+홀${oddCount} (본${hitMain.length}${hitMain.length ? ' '+hitMain.join(',') : ''}${hitBonus.length ? ' | 보너스 '+hitBonus.join(',') : ''}) → 총 ${hitCount}개 적중</div>
            </div>
        `;
    }

    // ========================================================================
    // 📊 백테스트 (실제 동작)
    // ========================================================================
    function runBacktest() {
        const baseRound = parseInt(document.getElementById('baseRound').value) || 1235;
        const start = parseInt(document.getElementById('btStartRound').value) || 1000;
        const endRaw = parseInt(document.getElementById('btEndRound').value) || 1234;
        const end = checkFutureData(endRaw);
        const minMatch = parseInt(document.getElementById('minMatch').value) || 1;
        const topN = parseInt(document.getElementById('topCount').value) || 40;
        const excludeBonus = isBonusExcluded();
        const sortMode = document.getElementById('similarSort')?.value || 'high';
        const offset = parseInt(document.getElementById('refOffset').value) || -1;

        if (start >= end) { alert('시작 회차는 종료 회차보다 작아야 합니다.'); return; }

        const resultDiv = document.getElementById('backtestResult');
        resultDiv.innerHTML = `<div style="text-align:center;padding:20px;color:#aaa;">⏳ 분석 중입니다. (${end - start + 1}개 회차)...</div>`;

        const results = [];
        let total9 = 0, totalV23 = 0, totalTop10 = 0;
        let max9 = 0, maxV23 = 0;

        setTimeout(() => {
            for (let round = start; round <= end; round++) {
                const win = getWinning(round);
                if (!win) continue;
                const winMain = win.main;
                const winBonus = win.bonus;

                const simResult = findSimilar(round, start, minMatch, topN, offset);
                if (simResult.similar.length === 0) {
                    results.push({ round, win: winMain, bonus: winBonus, nums9: [], hit9: 0, v23nums: [], hitV23: 0, topPredNums: [], hitTop10: 0 });
                    continue;
                }

                const freq = calcFreq(simResult.similar);
                const allSimNums = [];
                simResult.similar.forEach(s => { s.remainedNums.forEach(n => allSimNums.push(n)); });
                const freqMap = {};
                allSimNums.forEach(n => freqMap[n] = (freqMap[n] || 0) + 1);
                const validSet = new Set(Object.keys(freqMap).filter(k => freqMap[k] >= minMatch).map(Number));
                const allNextNums = [];
                simResult.similar.forEach(s => { s.nextNums.forEach(n => allNextNums.push(n)); });
                const nextFreqMap = {};
                allNextNums.forEach(n => nextFreqMap[n] = (nextFreqMap[n] || 0) + 1);
                const pool3 = Object.keys(nextFreqMap).filter(k => nextFreqMap[k] >= 2).map(Number);
                const oneHit = Object.keys(nextFreqMap).filter(k => nextFreqMap[k] === 1).map(Number);
                const scoredOne = oneHit.map(n => ({ num: Number(n), score: 0 })).sort((a,b)=>b.score - a.score);
                const additional = scoredOne.slice(0, 6).map(item => item.num);
                const finalPool3 = [...new Set([...pool3, ...additional])].sort((a,b)=>a-b);
                const simFreqMap = {};
                allSimNums.forEach(n => simFreqMap[n] = (simFreqMap[n] || 0) + 1);
                const pool4 = Object.keys(simFreqMap).filter(k => simFreqMap[k] >= 2).map(Number).sort((a,b)=>a-b);
                const top10Result = getTop10FromPattern(round, start, minMatch, 30, excludeBonus, sortMode, offset);
                const topPredNums = top10Result.map(p => p.num);
                const hitTop10 = topPredNums.filter(n => winMain.includes(n)).length;
                totalTop10 += hitTop10;

                // 9MAX
                const oneHitCandidates = [...validSet];
                let guaranteed = [...pool4];
                while (guaranteed.length > 9) guaranteed.pop();
                const restCandidates = oneHitCandidates.filter(n => !guaranteed.includes(n));
                const baseNumsLocal = simResult.prevNums;
                const scoreMap9 = {};
                restCandidates.forEach(num => {
                    let score = (freq[num] || 0) * 1.2;
                    const related = [];
                    if (baseNumsLocal.length > 0) {
                        for (let i = 0; i < baseNumsLocal.length; i++) {
                            for (let j = i+1; j < baseNumsLocal.length; j++) {
                                const sum = baseNumsLocal[i] + baseNumsLocal[j];
                                const diff = Math.abs(baseNumsLocal[i] - baseNumsLocal[j]);
                                if (sum <= 45) related.push(sum);
                                if (diff > 0) related.push(diff);
                            }
                        }
                    }
                    if (related.includes(num)) score += 16;
                    if (topPredNums.includes(num)) score += 30;
                    scoreMap9[num] = Math.round(score * 10) / 10;
                });
                const sorted9 = Object.entries(scoreMap9).sort((a,b) => b[1] - a[1]).map(([num]) => parseInt(num));
                const fillers = sorted9.filter(n => !guaranteed.includes(n));
                let final9 = [...guaranteed];
                for (const n of fillers) { if (final9.length >= 9) break; if (!final9.includes(n)) final9.push(n); }
                if (final9.length < 9) {
                    const extra = oneHitCandidates.filter(n => !final9.includes(n));
                    for (const n of extra) { if (final9.length >= 9) break; final9.push(n); }
                }
                final9.sort((a,b) => a-b);
                const hit9 = final9.filter(n => winMain.includes(n)).length;
                total9 += hit9;
                if (hit9 > max9) max9 = hit9;

                // v23.0
                const scoreMapV23 = {};
                for (let i = 1; i <= 45; i++) {
                    let score = 0;
                    if (validSet.has(i)) score += 3;
                    if (finalPool3.includes(i)) score += 2;
                    if (pool4.includes(i)) score += 3;
                    if (topPredNums.includes(i)) score += 1;
                    scoreMapV23[i] = score;
                }
                const oneOrMore = Object.keys(freqMap).filter(k => freqMap[k] >= 1).map(Number);
                const sortedOneOrMore = oneOrMore.sort((a,b) => (scoreMapV23[b]||0) - (scoreMapV23[a]||0));
                const guaranteedV23 = sortedOneOrMore.slice(0, 5);
                if (guaranteedV23.length < 5) {
                    const extra = [...validSet].filter(n => !guaranteedV23.includes(n)).sort((a,b) => (scoreMapV23[b]||0) - (scoreMapV23[a]||0));
                    while (guaranteedV23.length < 5 && extra.length > 0) guaranteedV23.push(extra.shift());
                }
                const sortedAllV23 = Object.entries(scoreMapV23).sort((a,b) => b[1] - a[1] || a[0] - b[0]).map(([num]) => parseInt(num));
                const remainingV23 = sortedAllV23.filter(n => !guaranteedV23.includes(n));
                const fillersV23 = remainingV23.slice(0, 5);
                const v23Result = [...guaranteedV23, ...fillersV23].sort((a,b) => a-b);
                const hitV23 = v23Result.filter(n => winMain.includes(n)).length;
                totalV23 += hitV23;
                if (hitV23 > maxV23) maxV23 = hitV23;

                results.push({ round, win: winMain, bonus: winBonus, nums9: final9, hit9, v23nums: v23Result, hitV23, topPredNums, hitTop10 });
            }

            backtestResults = results;

            const totalRounds = results.length;
            const avg9 = (total9 / totalRounds).toFixed(2);
            const avgV23 = (totalV23 / totalRounds).toFixed(2);
            const avgTop10 = (totalTop10 / totalRounds).toFixed(2);

            let tableHtml = `<div class="summary-box">
                <div class="summary-item"><div class="value">${totalRounds}</div><div class="label">📊 분석 회차</div></div>
                <div class="summary-item"><div class="value">${avgTop10}</div><div class="label">🎯 TOP10 평균</div></div>
                <div class="summary-item"><div class="value">${avg9}</div><div class="label">🎯 9MAX 평균</div></div>
                <div class="summary-item"><div class="value">${avgV23}</div><div class="label">🧬 v23 평균</div></div>
                <div class="summary-item"><div class="value">${maxV23}</div><div class="label">🏆 v23 최대</div></div>
            </div>
            <table style="width:100%;margin-top:15px;border-collapse:collapse;font-size:12px;">
            <thead><tr style="background:#333;color:#ffd700;"><th>회차</th><th>당첨번호</th><th style="color:#2ecc71;">9MAX</th><th style="color:#9b59b6;">v23 10수</th></tr></thead><tbody>`;

            results.slice(-30).forEach(r => {
                const winStr = r.win.join(', ') + (r.bonus ? `(${r.bonus})` : '');
                tableHtml += `<tr><td>${r.round}</td><td style="color:#ffd700;">${winStr}</td><td>${r.nums9.join(' ')} (${r.hit9})</td><td style="color:#9b59b6;">${r.v23nums.join(' ')} (${r.hitV23})</td></tr>`;
            });
            tableHtml += `</tbody></table>`;

            resultDiv.innerHTML = tableHtml;
            console.log('✅ 백테스트 완료');
        }, 100);
    }

        }

        const baskets = [];

        const winMain = winData ? winData.main : [];

            const bonusCount6 = recommended6.filter(n => winBonus !== null && winBonus === n).length;
            html += `<tr>
                <td style="padding:8px;border:1px solid #444;color:#9b59b6;font-weight:bold;text-align:center;">${basket.name}</td>
                <td style="padding:8px;border:1px solid #444;text-align:center;">${uniqueNums.map(n => formatNum(n)).join(' ')}</td>
                <td style="padding:8px;border:1px solid #444;text-align:center;background:#1a1a2a;">
                    ${recommended6.map(n => formatNum(n)).join(' ')}
                    <span style="display:block;font-size:11px;color:#888;margin-top:4px;">
                        ${winData ? '✅ 본' + hitCount6 + '개' + (bonusCount6 ? ' + 보너스' : '') : '⚠️ 검증 전'}
                    </span>
                </td>
            </tr>`;
        });
        html += `</tbody></table></div>
            <div style="margin-top:15px;color:#888;font-size:12px;border-top:1px solid #333;padding-top:10px;">
                📌 각 전략별 10수 중에서 점수(scoreMap)가 높은 6수를 추천합니다. (기준 회차: ${base}회)
            </div>
        </div>`;
        resultDiv.insertAdjacentHTML('beforeend', html);
    }

    function openBacktestModal() {
        const baseRound = parseInt(document.getElementById('baseRound').value) || 1235;
        document.getElementById('btStartRound').value = 1000;
        document.getElementById('btEndRound').value = Math.min(baseRound, 1234);
        document.getElementById('backtestModal').classList.add('active');
        document.getElementById('backtestResult').innerHTML = '⏳ 분석을 실행하려면 "분석 실행" 버튼을 누르세요.';
    }

    function resetAll() {
        document.getElementById('resultArea').innerHTML = '<div class="loading">🟢 초기화 완료!</div>';
        similarData = null; winData = null; lastTop9 = []; lastV23Result = []; backtestResults = null;
    }

    function runManualTest() {
        const round = parseInt(document.getElementById('manualRound').value) || 1235;
        document.getElementById('baseRound').value = round;
        alert(`🔍 수동 테스트: 기준 회차를 ${round}회로 설정했습니다. "분석 실행"을 눌러주세요.`);
        runAnalysis();
    }

    document.getElementById('topCount').addEventListener('input', function() {
        document.getElementById('topCountDisplay').textContent = this.value;
    });

    window.onload = function() {
        const baseVal = checkFutureData(1235);
        document.getElementById('baseRound').value = baseVal;
        document.getElementById('manualRound').value = baseVal;
        document.getElementById('startRound').value = 1000;
        document.getElementById('topCount').value = 40;
        document.getElementById('topCountDisplay').textContent = 40;
        document.getElementById('refOffset').value = '-1';
        document.getElementById('excludeBonus').checked = true;
        document.getElementById('resultArea').innerHTML = '<div class="loading">🟢 v23.5 완전체 (동기화 + 10가지 전략) 준비 완료! "🚀 분석 실행"을 눌러주세요.</div>';
        console.log('🟢 v23.5 완전체 로드 완료');
    };
