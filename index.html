function createRNG(seed) {
    let s = seed >>> 0;
    return function() {
        s = (s * 1664525 + 1013904223) & 0xffffffff;
        return (s >>> 0) / 4294967296;
    };
}
function getWinning(round) {
    const row = DATA.find(r => r[0] === round);
    return row ? { main: row.slice(1,7), bonus: row[7] } : null;
}
function isBonusExcluded() { return document.getElementById('excludeBonus')?.checked !== false; }
function checkFutureData(baseRound) {
    const maxRound = DATA.reduce((max,row)=>Math.max(max,row[0]),0);
    if (baseRound > maxRound + 1) console.warn('⚠️ 예측 회차가 데이터 범위를 초과했습니다.');
    return baseRound;
}
function isPastRound(round) {
    const maxRound = DATA.reduce((max,row)=>Math.max(max,row[0]),0);
    return round <= maxRound;
}
function hasConsecutive3(arr) {
    if (arr.length < 3) return false;
    const sorted = [...arr].sort((a,b)=>a-b);
    for (let i=0; i<sorted.length-2; i++) {
        if (sorted[i+1]===sorted[i]+1 && sorted[i+2]===sorted[i]+2) return true;
    }
    return false;
}
function filterNoConsecutive3(arr, excludeSet, rng, maxAttempts=100) {
    let attempts=0, result=[...arr];
    while (hasConsecutive3(result) && attempts<maxAttempts) {
        attempts++;
        const sorted = [...result].sort((a,b)=>a-b);
        let replaceIdx=-1;
        for (let i=0; i<sorted.length-2; i++) {
            if (sorted[i+1]===sorted[i]+1 && sorted[i+2]===sorted[i]+2) {
                replaceIdx = result.indexOf(sorted[i+1]);
                break;
            }
        }
        if (replaceIdx===-1) break;
        const candidates=[];
        for (let c=1; c<=45; c++) {
            if (!result.includes(c) && !excludeSet.has(c)) candidates.push(c);
        }
        for (let i=candidates.length-1; i>0; i--) {
            const j=Math.floor(rng()*(i+1));
            [candidates[i],candidates[j]]=[candidates[j],candidates[i]];
        }
        let replaced=false;
        for (const candidate of candidates) {
            const testArr=[...result];
            testArr[replaceIdx]=candidate;
            if (!hasConsecutive3(testArr)) {
                result[replaceIdx]=candidate;
                replaced=true;
                break;
            }
        }
        if (!replaced && attempts>30) {
            const indices=[0,1,2,3,4,5];
            for (let i=indices.length-1; i>0; i--) {
                const j=Math.floor(rng()*(i+1));
                [indices[i],indices[j]]=[indices[j],indices[i]];
            }
            const toReplace=indices.slice(0,2);
            let ci=0;
            for (const idx of toReplace) {
                if (ci<candidates.length) result[idx]=candidates[ci++];
            }
            result.sort((a,b)=>a-b);
        }
    }
    result.sort((a,b)=>a-b);
    return result;
}

// ========================================================================
// getBalanced6FromCandidates (중복 제거 강화)
// ========================================================================
function getBalanced6FromCandidates(candidates, excludeSet, lowTarget, midTarget, highTarget, fallbackPool, rng) {
    const low=[], mid=[], high=[];
    candidates.forEach(n => {
        if (!excludeSet.has(n)) {
            if (n<=15) low.push(n);
            else if (n<=30) mid.push(n);
            else high.push(n);
        }
    });
    let fallbackLow=[], fallbackMid=[], fallbackHigh=[];
    if (fallbackPool && fallbackPool.length > 0) {
        fallbackPool.forEach(n => {
            if (!excludeSet.has(n)) {
                if (n<=15) fallbackLow.push(n);
                else if (n<=30) fallbackMid.push(n);
                else fallbackHigh.push(n);
            }
        });
    }
    const pickRandom = (arr, count) => {
        const shuffled=[...arr];
        for (let i=shuffled.length-1; i>0; i--) {
            const j=Math.floor(rng()*(i+1));
            [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
        }
        return shuffled.slice(0, count);
    };
    let result=[];
    result.push(...pickRandom(low, lowTarget));
    result.push(...pickRandom(mid, midTarget));
    result.push(...pickRandom(high, highTarget));
    
    result = [...new Set(result)];
    
    const needLow = lowTarget - result.filter(n=>n<=15).length;
    const needMid = midTarget - result.filter(n=>n>=16 && n<=30).length;
    const needHigh = highTarget - result.filter(n=>n>=31).length;
    if (needLow>0 && fallbackLow.length>0) {
        const addLow = fallbackLow.filter(n=>!result.includes(n));
        result.push(...pickRandom(addLow, needLow));
    }
    if (needMid>0 && fallbackMid.length>0) {
        const addMid = fallbackMid.filter(n=>!result.includes(n));
        result.push(...pickRandom(addMid, needMid));
    }
    if (needHigh>0 && fallbackHigh.length>0) {
        const addHigh = fallbackHigh.filter(n=>!result.includes(n));
        result.push(...pickRandom(addHigh, needHigh));
    }
    
    result = [...new Set(result)];
    
    while (result.length<6) {
        if (!fallbackPool || fallbackPool.length === 0) {
            for (let i=1; i<=45; i++) {
                if (result.length>=6) break;
                if (!result.includes(i) && !excludeSet.has(i)) result.push(i);
            }
            break;
        }
        const pool = fallbackPool.filter(n=>!result.includes(n) && !excludeSet.has(n));
        if (pool.length === 0) break;
        const shuffled=[...pool];
        for (let i=shuffled.length-1; i>0; i--) {
            const j=Math.floor(rng()*(i+1));
            [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
        }
        for (const n of shuffled) {
            if (result.length>=6) break;
            if (!result.includes(n)) result.push(n);
        }
    }
    return filterNoConsecutive3(result, excludeSet, rng);
}

function adjustRatio(combo, candidatePool, excludeSet, rng, oddTarget, evenTarget, highTarget, lowTarget) {
    let attempts = 0;
    combo = [...new Set(combo)];
    while (combo.length < 6) {
        const available = candidatePool.filter(n => !combo.includes(n) && !excludeSet.has(n));
        if (available.length === 0) break;
        combo.push(available[Math.floor(rng() * available.length)]);
    }
    combo.sort((a,b)=>a-b);

    while (attempts < 100) {
        let changed = false;
        let oddCount = combo.filter(n => n % 2 === 1).length;
        let highCount = combo.filter(n => n >= 23).length;

        if (oddTarget !== null && evenTarget !== null && oddCount !== oddTarget) {
            const available = candidatePool.filter(n => !combo.includes(n) && !excludeSet.has(n));
            if (available.length === 0) break;
            if (oddCount < oddTarget) {
                let idx = combo.findIndex(n => n % 2 === 0);
                if (idx !== -1) {
                    let candidates = available.filter(n => n % 2 === 1);
                    if (candidates.length > 0) {
                        let pick = candidates[Math.floor(rng() * candidates.length)];
                        combo[idx] = pick;
                        changed = true;
                    }
                }
            } else {
                let idx = combo.findIndex(n => n % 2 === 1);
                if (idx !== -1) {
                    let candidates = available.filter(n => n % 2 === 0);
                    if (candidates.length > 0) {
                        let pick = candidates[Math.floor(rng() * candidates.length)];
                        combo[idx] = pick;
                        changed = true;
                    }
                }
            }
        }

        if (highTarget !== null && lowTarget !== null && highCount !== highTarget) {
            const available = candidatePool.filter(n => !combo.includes(n) && !excludeSet.has(n));
            if (available.length === 0) break;
            if (highCount < highTarget) {
                let idx = combo.findIndex(n => n < 23);

        if (i<groupB.length) result.push(groupB[i]);
    }
    return result;
}

        case 'EXCLUSIVE_ONLY': {

            candidates = interleaveGroups(ex3, ex4);

        }
    }
    if (groupMode === 'HIGH_LOW') {
        const lows = candidates.filter(n=>n<=22);
        const highs = candidates.filter(n=>n>=23);
        candidates = interleaveGroups(lows, highs);
    } else if (groupMode === 'ODD_EVEN') {
        const odds = candidates.filter(n=>n%2===1);
        const evens = candidates.filter(n=>n%2===0);

}

        const union = new Set([...nums,...baseNums]).size;
        const jaccard = union>0 ? intersection/union : 0;

function runCustomAnalysis() {
    let raw = document.getElementById('filterCustomInput').value;
    if (!raw || raw.trim()==='') { alert('⚠️ 커스텀 번호를 입력해주세요.'); return; }
    const tokens = raw.match(/\d+/g);
    if (!tokens) { alert('⚠️ 유효한 숫자를 입력해주세요.'); return; }
    let nums = tokens.map(Number).filter(n=>n>=1&&n<=45);
    nums = [...new Set(nums)];
    if (nums.length<6) { alert('⚠️ 최소 6개 이상의 서로 다른 숫자를 입력해주세요.'); return; }
    nums.sort((a,b)=>a-b);

    const base = parseInt(document.getElementById('baseRound').value)||1223;
    const seed = parseInt(document.getElementById('randomSeed').value)||0;
    const winData = getWinning(base);
    const winMain = winData ? winData.main : [];
    const winBonus = winData ? winData.bonus : null;
    const winSet = new Set(winMain);

    function getCombinations(arr, r) {
        if (r === 0) return [[]];
        if (arr.length === 0) return [];
        const [first, ...rest] = arr;
        const withFirst = getCombinations(rest, r-1).map(c => [first, ...c]);
        const withoutFirst = getCombinations(rest, r);
        return [...withFirst, ...withoutFirst];
    }

    const allCombos = getCombinations(nums, 6);
    let passed = [];

    allCombos.forEach(combo => {
        const sorted = [...combo].sort((a,b)=>a-b);
        const sum = combo.reduce((a,b)=>a+b, 0);
        if (sum < 100 || sum > 170) return;
        let hasConsec = false;
        for (let i=0; i<sorted.length-2; i++) {
            if (sorted[i+1]===sorted[i]+1 && sorted[i+2]===sorted[i]+2) hasConsec = true;
        }
        if (hasConsec) return;
        const oddCount = combo.filter(n=>n%2===1).length;
        if (oddCount < 2 || oddCount > 4) return;
        const highCount = combo.filter(n=>n>=23).length;
        if (highCount < 2 || highCount > 4) return;
        const low = combo.filter(n=>n<=15).length;
        const mid = combo.filter(n=>n>=16 && n<=30).length;
        const high = combo.filter(n=>n>=31).length;
        if (low === 0 || mid === 0 || high === 0) return;

        let structScore = 0;
        if (sum >= 120 && sum <= 150) structScore += 5;
        if (oddCount === 3) structScore += 5;
        if (highCount === 3) structScore += 5;
        if (low === 2 && mid === 2 && high === 2) structScore += 10;

        const hitMain = combo.filter(n=>winSet.has(n));
        const hitBonus = combo.filter(n=>n===winBonus);
        const totalHit = hitMain.length + (hitBonus.length > 0 ? 1 : 0);

        passed.push({ combo, structScore, hitMain, hitBonus, totalHit, sum, oddCount, highCount, low, mid, high });
    });

    passed.sort((a, b) => b.structScore - a.structScore);
    const maxScore = passed.length > 0 ? passed[0].structScore : 0;
    const topTier = passed.filter(item => item.structScore === maxScore);
    for (let i = topTier.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [topTier[i], topTier[j]] = [topTier[j], topTier[i]];
    }
    const topResults = topTier.slice(0, 10);

    if (topResults.length === 0) {
        document.getElementById('resultArea').innerHTML = `
            <div class="custom-area" style="border-color: #e74c3c;">
                <div class="label" style="color: #e74c3c;">⚠️ 패턴 일치 조합 없음</div>
                <div style="color:#aaa;font-size:13px;padding:10px;">
                    입력하신 숫자들 중에서는 <strong>실제 로또 패턴(합계/연속/홀짝/고저/구간)</strong>을 모두 만족하는 6개 조합이 없습니다.<br>
                    숫자를 더 다양하게 넣어보세요 (예: 1~45 전체 분포).
                </div>
            </div>
        `;
        return;
    }

    let html = `
        <div class="custom-area" style="border-color: #00b894;">
            <div class="label" style="color: #00b894;">🎯 실제 로또 패턴 기반 필터링 + 랜덤 셔플 (입력: ${nums.join(', ')})</div>
            <div style="font-size:12px;color:#aaa;margin-bottom:6px;">
                ✅ 합계(100~170) / 연속금지 / 홀짝(2~4) / 고저(2~4) / 구간(전구간 1개 이상) 통과 조합 중
                <span style="color:#ffd700;">⭐ 최고 점수(${maxScore}점) 조합을 무작위 추출</span>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;">`;

    topResults.forEach((r, idx) => {
        let borderColor = '#555';
        let bgColor = '#1a1a1a';
        if (r.structScore >= 20) { borderColor = '#2ecc71'; bgColor = '#0a2a0a'; }
        else if (r.structScore >= 10) { borderColor = '#f39c12'; bgColor = '#2a1a0a'; }

        const hitText = winData ? `📌 검증: ${r.totalHit}개 적중` : '📌 미추첨 회차';
        const hitColor = r.totalHit >= 3 ? '#2ecc71' : (r.totalHit >= 1 ? '#ffd700' : '#888');

        html += `
            <div style="background:${bgColor};border:2px solid ${borderColor};border-radius:8px;padding:6px 10px;">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <span style="color:#ffd700;font-size:11px;font-weight:bold;">
                        #${idx+1} (구조점수: ${r.structScore})
                        <span style="color:#888;font-size:9px;margin-left:4px;">| 홀${r.oddCount}/짝${6-r.oddCount} 고${r.highCount}/저${6-r.highCount} 구간${r.low}:${r.mid}:${r.high}</span>
                    </span>
                    <span style="color:${hitColor};font-size:11px;font-weight:bold;">${hitText}</span>
                </div>
                <div style="font-size:16px;font-weight:bold;letter-spacing:1px;">${r.combo.map(n=>colorNumSimple(n, winMain, winBonus)).join(' ')}</div>
                <div style="font-size:10px;color:#888;">합: ${r.sum}</div>
            </div>`;
    });

    html += `
            </div>
            <div style="margin-top:10px;padding:8px;background:#0a0a0a;border-radius:8px;border:2px solid #3498db;text-align:center;">
                <div style="color:#3498db;font-weight:bold;font-size:13px;">📊 ${base}회 ${winData ? `당첨번호: ${winMain.join(', ')} (보: ${winBonus})` : '아직 추첨되지 않았습니다.'}</div>
                <div style="color:#888;font-size:11px;">⭐ 구조점수가 높을수록 실제 로또 패턴(특히 2:2:2 구간)에 완벽에 가까운 조합입니다.<br>🔄 새로고침하거나 다시 실행하면 다른 조합이 나옵니다 (랜덤 셔플).</div>
            </div>
        </div>`;

    document.getElementById('resultArea').innerHTML = html;
}

function calculateSet(type) {
    const inputA = document.getElementById('setAInput');
    const inputB = document.getElementById('setBInput');
    if (!inputA || !inputB) return;
    const parseSet = (str) => (str.match(/\d+/g)||[]).map(Number).filter(n=>n>=1&&n<=45);
    const setA = new Set(parseSet(inputA.value));
    const setB = new Set(parseSet(inputB.value));
    let resultSet, label;
    switch(type) {
        case 'union': resultSet=new Set([...setA,...setB]); label='합집합 (A ∪ B)'; break;
        case 'intersection': resultSet=new Set([...setA].filter(x=>setB.has(x))); label='교집합 (A ∩ B)'; break;
        case 'difference': resultSet=new Set([...setA].filter(x=>!setB.has(x))); label='차집합 (A - B)'; break;
        case 'symmetricDifference': resultSet=new Set([...setA].filter(x=>!setB.has(x)).concat([...setB].filter(x=>!setA.has(x)))); label='대칭차집합 (A △ B)'; break;
        default: resultSet=new Set(); label='';
    }
    const sorted = Array.from(resultSet).sort((a,b)=>a-b);
    const resultDiv = document.getElementById('setResult');
    if (!resultDiv) return;
    const baseRound = parseInt(document.getElementById('baseRound').value)||1223;
    let winMain=[], winBonus=null;
    if (winData && winData.main) { winMain=winData.main; winBonus=winData.bonus; }
    else { const win=getWinning(baseRound); if (win) { winMain=win.main; winBonus=win.bonus; } }
    const winMainSet = new Set(winMain);
    const isBonus = (n)=>n===winBonus;
    let resultHtml = `<div class="set-result-box"><div><span class="label">${label}:</span> `;
    if (sorted.length===0) resultHtml+='∅ (공집합)';
    else {
        const marked = sorted.map(n=>{
            let color='#fff';
            if (winMainSet.has(n)) color='#2ecc71';
            else if (isBonus(n)) color='#ff6b6b';
            return `<span style="color:${color}; font-weight:bold; font-size:1.1em;">${n}</span>`;
        }).join(', ');
        resultHtml += marked;
    }
    resultHtml += `</div>`;
    const hitMainNums = sorted.filter(n=>winMainSet.has(n));
    const hitBonusNums = sorted.filter(n=>isBonus(n));
    const totalHits = hitMainNums.length + hitBonusNums.length;
    if (winMain.length>0) {
        resultHtml += `<div class="match-summary" style="margin-top:4px;">`;
        if (totalHits>0) {
            let parts=[];
            if (hitMainNums.length>0) parts.push(`본번호 일치: <strong style="color:#2ecc71;">${hitMainNums.join(', ')}</strong>`);
            if (hitBonusNums.length>0) parts.push(`보너스 일치: <strong style="color:#ff6b6b;">${hitBonusNums[0]}</strong>`);
            resultHtml += `<span class="match-count">✅ ${totalHits}개 일치 (${parts.join(' / ')})</span>`;
        } else resultHtml += `<span style="color:#888;">❌ 일치하는 당첨번호 없음</span>`;
        resultHtml += `</div>`;
    } else resultHtml += `<div style="color:#888;font-size:11px;margin-top:4px;">⚠️ ${baseRound}회 당첨번호 정보 없음</div>`;
    if (winMain.length>0) resultHtml += `<div class="winning-info-box" style="margin-top:4px;">📌 ${baseRound}회 당첨번호: <strong style="color:#2ecc71;">${winMain.join(', ')}</strong> | 보너스: <strong style="color:#ff6b6b;">${winBonus}</strong></div>`;
    else resultHtml += `<div class="winning-info-box" style="color:#888;border-color:#555;">⚠️ ${baseRound}회 당첨번호 정보 없음</div>`;
    resultHtml += `</div>`;
    resultDiv.innerHTML = resultHtml;
}

    if (customMode) { runCustomAnalysis(); return; }

function copyOnlyNumbers() {
    if (!lastBaseStrategies || Object.keys(lastBaseStrategies).length===0) { alert('⚠️ 먼저 분석을 실행해주세요!'); return; }
    const unique={}; const seen=new Set();
    Object.entries(lastBaseStrategies).forEach(([name,nums])=>{
        const key=nums.slice().sort((a,b)=>a-b).join(',');
        if (!seen.has(key)) { seen.add(key); unique[name]=nums; }
    });
    let text='📊 10개 조합 (제외 적용, 중복제거)\n'+'='.repeat(30)+'\n\n';
    for (const [name,nums] of Object.entries(unique)) text += name+': '+nums.join(', ')+'\n';
    text += '\n'+'='.repeat(30)+'\n9MAX: '+lastTop9.join(', ')+'\n최종10수: '+lastFinal10.join(', ')+'\n방정식TOP10: '+lastEquationTop10.join(', ');
    navigator.clipboard.writeText(text).then(()=>alert('✅ 번호만 복사되었습니다!')).catch(()=>{ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('✅ 번호만 복사되었습니다!'); });
}
