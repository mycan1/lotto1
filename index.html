        // ========================================================================

        let activeFreq2 = [], oldNextFreq2 = [];

        let similarData = null, freqData = null, winData = null, baseNums = [];
        let topNumsAll = [], lastTopPred = [], lastBonusIntersection = [], lastTop9 = [], lastStrong5 = [];
        let currentTopN = 6, poolInfo = { baseCount: 0, addedCount: 0 };

        // ========================================================================
        // 3. 헬퍼 함수
        // ========================================================================
        function getWinning(round) {
            const row = DATA.find(r => r[0] === round);
            return row ? { main: row.slice(1, 7), bonus: row[7] } : null;
        }

        function findSimilar(baseRound, startRound, minMatch, topN) {
            const prev = getWinning(baseRound - 1);
            if (!prev) return { similar: [], prevNums: [] };
            const baseNums = prev.main;
            const result = [];
            const winData = getWinning(baseRound);
            for (const row of DATA) {
                const r = row[0];
                if (r >= baseRound || r < startRound) continue;
                const nums = row.slice(1, 7);
                const matched = nums.filter(n => baseNums.includes(n));
                if (matched.length >= minMatch) {
                    const next = (r + 1 < baseRound) ? getWinning(r + 1) : null;
                    let winMatchCount = 0;
                    if (winData) winMatchCount = nums.filter(n => winData.main.includes(n)).length;
                    result.push({
                        round: r, nums, bonus: row[7], matched, matchCount: matched.length,
                        nextNums: next ? next.main : [], nextBonus: next ? next.bonus : null,
                        winMatchCount
                    });
                }
            }
            result.sort((a, b) => b.winMatchCount - a.winMatchCount || b.matchCount - a.matchCount);
            return { similar: result.slice(0, topN), prevNums: baseNums };
        }

        function calcFreq(similarResults) {
            const freq = {};
            similarResults.forEach(s => {
                s.nextNums.forEach(n => { freq[n] = (freq[n] || 0) + 1; });
                if (s.nextBonus !== null) { freq[s.nextBonus] = (freq[s.nextBonus] || 0) + BONUS_WEIGHT; }
                s.nums.forEach(n => { freq[n] = (freq[n] || 0) + 0.5; });
                if (s.bonus !== null) { freq[s.bonus] = (freq[s.bonus] || 0) + BONUS_WEIGHT * 0.5; }
            });
            return freq;
        }

        function getCombinations(arr, k) {
            if (k === 0) return [[]];
            if (arr.length === 0) return [];
            const result = [];
            const [first, ...rest] = arr;
            for (const combo of getCombinations(rest, k - 1)) result.push([first, ...combo]);
            for (const combo of getCombinations(rest, k)) result.push(combo);
            return result;
        }

        function getUnifiedScore(n) {
            let s = 0;
            if (globalIntersectionMap[n]) s += 20;
            if (lastBonusIntersection.includes(n)) s += 10;
            if (activeFreq2.includes(n)) s += 25;
            if (oldNextFreq2.includes(n)) s += 10;
            if (topNumsAll.includes(n)) s += 30;
            s += (globalFreqData[n] || 0) * 0.2;
            return s;

            let color = '#fff';
            let mark = '';
            if (winMain && winMain.includes(n)) {

                mark = '★';
            } else if (winBonus !== null && winBonus === n) {

                mark = '☆';
            }
            return `<span style="color:${color}; font-weight:bold;">${n}${mark}</span>`;
        }

        function colorArray(arr, winMain, winBonus) {
            return arr.map(n => colorNum(n, winMain, winBonus)).join(', ');

        // ========================================================================

        function runAnalysis() {
            const logs = [];
            const LOG_TYPES = { INFO: 'info', SUCCESS: 'success', WARNING: 'warning', ERROR: 'error' };
            function addLog(msg, type = LOG_TYPES.INFO) {
                const time = new Date().toLocaleTimeString();

                    case LOG_TYPES.ERROR: console.log(`%c${prefix} ❌ ${msg}`, 'color: #e74c3c; font-weight: bold;'); break;

            }

            const base = parseInt(document.getElementById('baseRound').value) || 1234;
            const start = parseInt(document.getElementById('startRound').value) || 1200;

            const result = findSimilar(base, start, min, topN);
            if (result.similar.length === 0) {
                addLog('⚠️ 유사회차를 찾을 수 없습니다.', LOG_TYPES.ERROR);

                return;
            }
            addLog(`[1단계] 기준 패턴 추출 완료 (${base-1}회): ${result.prevNums.join(', ')}`);

            similarData = result.similar;
            baseNums = result.prevNums;
            addLog(`[2단계] 유사 회차 스캔 완료 (조건 만족: ${result.similar.length}개) - 회차: ${result.similar.map(s=>s.round).join(', ')}`);

            const freq = calcFreq(result.similar);
            freqData = freq;
            globalFreqData = freq;
            winData = getWinning(base);
            const topCandidates = result.similar.slice(0, topN);

            const winMain = winData ? winData.main : [];
            const winBonus = winData ? winData.bonus : null;
            const allSimNums = [];
            const allNextNums = [];
            const simRounds = [];
            const nextRounds = [];

            result.similar.forEach(s => {
                simRounds.push({ round: s.round, nums: s.nums, bonus: s.bonus, match: s.matchCount });
                s.nums.forEach(n => allSimNums.push(n));
                if (s.bonus) allSimNums.push(s.bonus);
                if (s.nextNums.length > 0) {
                    nextRounds.push({ round: s.round + 1, nums: s.nextNums, bonus: s.nextBonus });
                    s.nextNums.forEach(n => allNextNums.push(n));
                    if (s.nextBonus) allNextNums.push(s.nextBonus);
                }
            });

            const uniqueSim = [...new Set(allSimNums)].sort((a,b)=>a-b);
            const uniqueNext = [...new Set(allNextNums)].sort((a,b)=>a-b);

            const simHit = uniqueSim.filter(n => winMain.includes(n) || n === winBonus);
            const nextHit = uniqueNext.filter(n => winMain.includes(n) || n === winBonus);
            const simRate = uniqueSim.length > 0 ? (simHit.length / uniqueSim.length * 100).toFixed(1) : 0;
            const nextRate = uniqueNext.length > 0 ? (nextHit.length / uniqueNext.length * 100).toFixed(1) : 0;
            addLog(`[포함률] 유사회차: ${simRate}% (${simHit.length}/${uniqueSim.length}), 유사다음회차: ${nextRate}% (${nextHit.length}/${uniqueNext.length})`);

            const allFreqMap = {};
            [...allSimNums, ...allNextNums].forEach(n => { allFreqMap[n] = (allFreqMap[n] || 0) + 1; });
            const sortedFreq = Object.entries(allFreqMap).sort((a,b) => b[1] - a[1] || a[0] - b[0]);
            const top20 = sortedFreq.slice(0, 20).map(([num, cnt]) => ({ num: parseInt(num), cnt }));

            const nextFreqMap = {};
            allNextNums.forEach(n => { nextFreqMap[n] = (nextFreqMap[n] || 0) + 1; });
            const pool3 = Object.keys(nextFreqMap).filter(k => nextFreqMap[k] >= 2).map(Number);
            const oneHitNext = Object.keys(nextFreqMap).filter(k => nextFreqMap[k] === 1).map(Number);
            const scoredOne = oneHitNext.map(n => {
                let score = 0;
                if (winData && winData.main.includes(Number(n))) score += 5;
                if (winData && winData.bonus === Number(n)) score += 3;
                return { num: Number(n), score };
            });
            scoredOne.sort((a,b) => b.score - a.score);
            const additional = scoredOne.slice(0, 6).map(item => item.num);
            const finalPool3 = [...new Set([...pool3, ...additional])].sort((a,b)=>a-b);
            addLog(`[3단계] ③번 동반수 계산 완료 (기본 ${pool3.length}개 + 점수제 ${additional.length}개 = 총 ${finalPool3.length}개)`);

            const simFreqMap = {};
            allSimNums.forEach(n => { simFreqMap[n] = (simFreqMap[n] || 0) + 1; });
            const pool4 = Object.keys(simFreqMap).filter(k => simFreqMap[k] >= 2).map(Number).sort((a,b)=>a-b);
            addLog(`[4단계] ④번 동반수 (유사회차 2회 이상) 계산 완료 (${pool4.length}개)`);

            const pool5 = finalPool3.filter(n => pool4.includes(n));

            const predScore = {};
            result.similar.forEach(s => {
                if (s.nextNums.length === 0) return;

                s.nextNums.forEach(n => {

                    predScore[n] = (predScore[n] || 0) + score;
                });
            });
            const topPred = Object.entries(predScore)

            lastTopPred = topPred;

        // ========================================================================
        // 5. 1수 분석 (내부 호출용)
        // ========================================================================
        function runAnalysisForOne(silent = false) {
            const topN = parseInt(document.getElementById('topCountOne').value) || 3;
            const base = parseInt(document.getElementById('baseRound').value) || 1234;
            const start = parseInt(document.getElementById('startRound').value) || 1200;
            const min = parseInt(document.getElementById('minMatch').value) || 2;
            const result = findSimilar(base, start, min, topN);
            if (result.similar.length === 0) return null;

            const freq = calcFreq(result.similar);
            const topCandidates = result.similar.slice(0, topN);
            const topAllNums = [];
            for (const s of topCandidates) {
                const allNums = [...s.nums];
                if (s.bonus !== null) allNums.push(s.bonus);
                for (const n of allNums) topAllNums.push(n);
            }

            const topFreq = {};
            for (const n of topAllNums) topFreq[n] = (topFreq[n] || 0) + 1;

            const bonusSet = new Set(), nextBonusSet = new Set();
            for (const s of result.similar) {
                if (s.bonus !== null) bonusSet.add(s.bonus);
                if (s.nextBonus !== null) nextBonusSet.add(s.nextBonus);
            }
            const bonusIntersection = [...bonusSet].filter(n => nextBonusSet.has(n)).sort((a,b)=>a-b);

            const topNextAllNums = [];
            for (const s of topCandidates) {
                if (s.round + 1 < base && s.nextNums.length > 0) {
                    const allNext = [...s.nextNums];
                    if (s.nextBonus !== null) allNext.push(s.nextBonus);
                    for (const n of allNext) topNextAllNums.push(n);
                }
            }
            const topNextFreq = {};
            for (const n of topNextAllNums) topNextFreq[n] = (topNextFreq[n] || 0) + 1;

            const predScore = {}, predCount = {};
            for (const s of result.similar) {
                if (!(s.round + 1 < base && s.nextNums.length > 0)) continue;
                const weight = s.matchCount;
                for (const n of s.nextNums) {
                    predCount[n] = (predCount[n] || 0) + 1;
                    let score = weight;
                    if (freq[n]) score += freq[n] * 0.8;
                    if (bonusIntersection.includes(n)) score += 2.0;
                    predScore[n] = (predScore[n] || 0) + score;
                }
            }
            const topPred = Object.entries(predScore)
                .sort((a,b) => b[1] - a[1])
                .slice(0, 10)
                .map(([num, score]) => ({ num: parseInt(num), score: Math.round(score * 10) / 10, count: predCount[num] || 0 }));
            const topPredNums = topPred.map(item => item.num);

            const basePool = Object.keys(topFreq).filter(k => topFreq[k] >= 2).map(Number);
            const oneHit = Object.keys(topFreq).filter(k => topFreq[k] === 1).map(Number);
            const scoredOne = oneHit.map(n => {
                let score = 0;
                if (bonusIntersection.includes(n)) score += 3;
                if (topPredNums.includes(n)) score += 2;
                if (topNextFreq[n] > 0) score += 1;
                if (freq[n] >= 5) score += 1;
                return { num: Number(n), score };
            });
            scoredOne.sort((a,b) => b.score - a.score);
            let finalPool = [...basePool];
            for (const item of scoredOne) {
                if (finalPool.length >= 20) break;
                if (!finalPool.includes(item.num)) finalPool.push(item.num);
            }
            finalPool.sort((a, b) => (freq[b] || 0) - (freq[a] || 0));

            const tInterMap = {};
            const tInter = finalPool.filter(n => topPredNums.includes(n) && bonusIntersection.includes(n));
            for (const n of tInter) tInterMap[n] = true;

            const tierMap = {1:[],2:[],3:[],4:[],5:[]};
            finalPool.forEach(n => {
                const isInter = tInterMap[n] || false;
                const isTop10 = topPredNums.includes(n);
                if (isInter && isTop10) tierMap[1].push(n);
                else if (isInter) tierMap[2].push(n);
                else if (isTop10) tierMap[3].push(n);
                else tierMap[4].push(n);
            });
            const scoreFn = (n) => {
                let s = (freq[n] || 0) * 2;
                if (tInterMap[n]) s += 20;
                if (topPredNums.includes(n)) s += 10;
                return s;
            };
            for (let t=1; t<=4; t++) {
                tierMap[t].sort((a,b) => scoreFn(b) - scoreFn(a) || a - b);
            }
            const ranked = [...tierMap[1], ...tierMap[2], ...tierMap[3], ...tierMap[4]];

            return {
                ranked: ranked,
                freq: freq,
                topPredNums: topPredNums,
                winData: winData,
                topN: topN,
                finalPool: finalPool,
                tInter: tInter
            };
        }

        // ========================================================================

        // ========================================================================
        function generateGungHapCombos() {
            if (!similarData) { alert('⚠️ 먼저 "분석 실행"을 해주세요.'); return; }
            optimizeNine();
            const top9 = lastTop9;
            const sorted = [...top9].sort((a, b) => getUnifiedScore(b) - getUnifiedScore(a));
            const strong5 = sorted.slice(0, 5);
            const rest = top9.filter(n => !strong5.includes(n));
            if (rest.length < 1) { alert('⚠️ 나머지 풀 부족'); return; }

            const combos = [];
            const used = new Set();
            for (let i = 0; i < 10 && i < rest.length; i++) {
                const combo = [...strong5, rest[i % rest.length]];
                combo.sort((a,b) => a - b);
                const key = combo.join(',');
                if (!used.has(key)) { used.add(key); combos.push(combo); }
            }
            while (combos.length < 10 && rest.length > 0) {
                const combo = [...strong5, rest[combos.length % rest.length]];
                combo.sort((a,b) => a - b);
                const key = combo.join(',');
                if (!used.has(key)) { used.add(key); combos.push(combo); }
            }

            const win = winData;
            const winMain = win ? win.main : [];
            const winBonus = win ? win.bonus : null;

            function getRankLabel(matchCount, hasBonus) {
                if (matchCount === 6) return '🏆 1등!!!';
                if (matchCount === 5 && hasBonus) return '🥈 2등!!';
                if (matchCount === 5) return '🥉 3등!';
                if (matchCount === 4) return '🎯 4등!';
                if (matchCount === 3 && hasBonus) return '✅ 5등+보너스!';
                if (matchCount === 3) return '✅ 5등!';
                return `${matchCount}개`;
            }

            let html = document.getElementById('resultArea').innerHTML || '';
            html += `<div class="section-title">🧩 강력5수 포함 조합 (9수 기반)</div>`;
            html += `<div style="margin-bottom:10px; font-size:13px; color:#888;">
                🔥 강력5수 (데이터 기반): <strong>${strong5.join(', ')}</strong><br>
                📊 9수: ${top9.join(', ')}
            </div>`;
            html += `<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">`;
            combos.slice(0,10).forEach((c, i) => {
                const matchMain = c.filter(n => winMain.includes(n));
                const matchBonus = c.filter(n => n === winBonus);
                const matchCount = matchMain.length;
                const hasBonus = matchBonus.length > 0;
                const rankLabel = getRankLabel(matchCount, hasBonus);

                const display = c.map(n => {
                    if (winMain.includes(n)) return `<span style="color:#2ecc71; font-weight:bold;">${n}★</span>`;
                    else if (n === winBonus) return `<span style="color:#ff6b6b; font-weight:bold;">${n}☆</span>`;
                    else if (strong5.includes(n)) return `<span style="color:#ffd700; font-weight:bold;">${n}🔥</span>`;
                    return n;
                }).join(' ');

                html += `<div class="combo-box" style="border-color:#e67e22;">
                    <span style="color:#e67e22; font-weight:bold; margin-right:8px;">#${i+1}</span>
                    ${display}
                    <span style="margin-left:10px; font-size:12px; color:#aaa;">${rankLabel}</span>
                </div>`;
            });
            html += `</div>`;
            html += `<div class="source" style="margin-top:10px;">📅 기준 회차: ${document.getElementById('baseRound').value}회</div>`;
            document.getElementById('resultArea').innerHTML = html;

                results.forEach(r => {
                    const winStr = r.win.join(', ') + (r.bonus ? ` (${r.bonus}☆)` : '');
                    const winMain = r.win;
                    const winBonus = r.bonus;
                    const num9Str = r.nums9.map(n => {
                        let c = '#ddd';
                        if (winMain.includes(n)) c = '#2ecc71';
                        else if (n === winBonus) c = '#ff6b6b';
                        return `<span style="color:${c}; font-weight:bold;">${n}</span>`;
                    }).join(' ');
                    const num5Str = r.nums5.map(n => {
                        let c = '#ddd';
                        if (winMain.includes(n)) c = '#2ecc71';
                        else if (n === winBonus) c = '#ff6b6b';
                        return `<span style="color:${c}; font-weight:bold;">${n}</span>`;
                    }).join(' ');
                    const hit1Str = r.hit1 ? '✅ 당첨!' : (r.hit1Bonus ? '⭐ 보너스!' : '❌ 미당첨');
                    const hitColor = r.hit1 ? '#2ecc71' : (r.hit1Bonus ? '#ff6b6b' : '#888');
                    
                    // ★★★ ⑤ 교집합 표시 (당첨번호와 비교하여 색상 표시) ★★★
                    const inter5Str = r.inter5.length > 0 ? r.inter5.map(n => {
                        let c = '#ddd';
                        if (winMain.includes(n)) c = '#2ecc71';
                        else if (n === winBonus) c = '#ff6b6b';
                        return `<span style="color:${c}; font-weight:bold;">${n}</span>`;
                    }).join(' ') : '없음';

                    tableHtml += `<tr>
                        <td>${r.round}</td>
                        <td style="color:#ffd700; font-weight:bold;">${winStr}</td>
                        <td>${num9Str} <span class="hit-cell">(${r.hit9}개)</span></td>
                        <td>${num5Str} <span class="hit-cell">(${r.hit5}개)</span></td>
                        <td style="color:${hitColor}; font-weight:bold;">${r.num1 || '-'} ${hit1Str}</td>
                        <td style="background:#1a1a2a; color:#ddd; font-weight:bold;">${inter5Str}</td>
                    </tr>`;
                });
                tableHtml += `</tbody></table>`;

                const summaryHtml = `<div class="summary-box">
                    <div class="summary-item"><div class="value">${totalRounds}</div><div class="label">📊 분석 회차</div></div>
                    <div class="summary-item"><div class="value">${avg9}</div><div class="label">🎯 9수 평균 적중</div></div>
                    <div class="summary-item"><div class="value">${avg5}</div><div class="label">🎯 5수 평균 적중</div></div>
                    <div class="summary-item"><div class="value">${rate1}%</div><div class="label">💪 1수 본번호 당첨률</div></div>
                    <div class="summary-item"><div class="value">${rate1B}%</div><div class="label">💪 1수 보너스 당첨률</div></div>
                    <div class="summary-item"><div class="value">${max9}</div><div class="label">🏆 최대 9수 적중</div></div>
                </div>`;

                body.innerHTML = tableHtml + summaryHtml;

            }, 100);
        }

        // ========================================================================
        // 13. 리셋
        // ========================================================================
        function resetAll() {
            document.getElementById('resultArea').innerHTML = '<div class="loading">분석 결과가 여기에 표시됩니다.</div>';
            similarData = null; winData = null; activeFreq2 = []; oldNextFreq2 = []; globalFreqData = {};
            topNumsAll = []; lastTopPred = []; lastBonusIntersection = []; lastTop9 = []; lastStrong5 = [];
            globalIntersectionMap = {};
            console.log('%c🗑️ 모든 분석 데이터가 초기화되었습니다.', 'color: #ffd700;');
        }

        document.getElementById('topCount').addEventListener('input', function() {
            document.getElementById('topCountDisplay').textContent = this.value;
        });
        document.getElementById('topCountOne').addEventListener('input', function() {
            document.getElementById('topCountOneDisplay').textContent = this.value;
        });

        window.onload = function() {
            document.getElementById('baseRound').value = 1234;
            document.getElementById('startRound').value = 1200;
            document.getElementById('topCount').value = 6;
            document.getElementById('topCountOne').value = 3;
            document.getElementById('topCountDisplay').textContent = 6;
            document.getElementById('topCountOneDisplay').textContent = 3;
            runAnalysis();
        };
    </script>
</body>
