    // ========================================================================
    // 3. 헬퍼 함수
    // ========================================================================
    function getWinning(round) {
        const row = DATA.find(r => r[0] === round);
        return row ? { main: row.slice(1, 7), bonus: row[7] } : null;
    }

    function isBonusExcluded() {
        return document.getElementById('excludeBonus')?.checked !== false;
    }

    // 🔥 핵심 수정: baseRound - 1을 기준 패턴으로 사용 (1233 패턴으로 1234 예측)
    function findSimilar(baseRound, startRound, minMatch, topN) {
        const prev = getWinning(baseRound - 1);
        if (!prev) return { similar: [], prevNums: [] };
        const baseNums = prev.main;
        const baseBonus = prev.bonus;
        const result = [];
        const excludeBonus = isBonusExcluded();
        const sortMode = document.getElementById('similarSort')?.value || 'high';

        for (const row of DATA) {
            const r = row[0];
            if (r >= baseRound || r < startRound) continue;
            const nums = row.slice(1, 7);
            const bonus = row[7];
            let matchCount = nums.filter(n => baseNums.includes(n)).length;
            if (!excludeBonus && bonus === baseBonus) matchCount += 1;
            if (matchCount >= minMatch) {
                const next = (r + 1 < baseRound) ? getWinning(r + 1) : null;
                const nextFiltered = next ? next.main.filter(n => !baseNums.includes(n)) : [];
                const nextBonusFiltered = (next && next.bonus !== null && !baseNums.includes(next.bonus)) ? next.bonus : null;
                result.push({
                    round: r,
                    remainedNums: nums.filter(n => !baseNums.includes(n)),
                    bonus: bonus,
                    matchCount: matchCount,
                    nextNums: nextFiltered,
                    nextBonus: nextBonusFiltered,
                });
            }
        }
        result.sort((a, b) => {
            if (sortMode === 'low') {
                if (a.matchCount !== b.matchCount) return a.matchCount - b.matchCount;
            } else {
                if (b.matchCount !== a.matchCount) return b.matchCount - a.matchCount;
            }
            return b.round - a.round;
        });
        return { similar: result.slice(0, topN), prevNums: baseNums };
    }

    function calcFreq(similarResults) {
        const freq = {};
        const excludeBonus = isBonusExcluded();
        similarResults.forEach(s => {
            s.nextNums.forEach(n => { freq[n] = (freq[n] || 0) + 1; });
            if (!excludeBonus && s.nextBonus !== null) freq[s.nextBonus] = (freq[s.nextBonus] || 0) + 0.5;
            s.remainedNums.forEach(n => { freq[n] = (freq[n] || 0) + 0.5; });
            if (!excludeBonus && s.bonus !== null) freq[s.bonus] = (freq[s.bonus] || 0) + 0.5;
        });
        return freq;
    }

    function getCombinations(arr, k) {
        if (k === 0) return [[]];
        if (arr.length === 0) return [];
        const result = [];
        const [first, ...rest] = arr;
        for (const combo of getCombinations(rest, k - 1)) result.push([first, ...combo]);
        for (const combo of getCombinations(rest, k)) result.push(combo);
        return result;
    }

    function getUnifiedScore(n) {
        let s = 0;
        if (globalIntersectionMap[n]) s += 20;
        if (lastBonusIntersection.includes(n)) s += 10;
        if (activeFreq2.includes(n)) s += 25;
        if (oldNextFreq2.includes(n)) s += 10;
        s += (globalFreqData[n] || 0) * 0.2;
        return s;
    }

    // 🔥 colorNum 복원: 당첨번호와 일치하면 녹색 + ★/☆ 표시
    function colorNum(n, winMain, winBonus, showMark = true) {
        let color = '#fff';
        let mark = '';
        if (showMark && winMain && winMain.includes(n)) {
            color = '#2ecc71';
            mark = '★';
        } else if (showMark && winBonus !== null && winBonus === n) {
            color = '#2ecc71';
            mark = '☆';
        }
        return `<span style="color:${color}; font-weight:bold;">${n}${mark}</span>`;
    }

    function colorArray(arr, winMain, winBonus, showMark = true) {
        return arr.map(n => colorNum(n, winMain, winBonus, showMark)).join(', ');
    }

    function checkFutureData(baseRound) {
        const maxRound = DATA.reduce((max, row) => Math.max(max, row[0]), 0);
        if (baseRound > maxRound) {
            console.warn(`⚠️ 기준 회차(${baseRound})는 데이터 최대 회차(${maxRound})보다 큽니다.`);
        }
        return baseRound;
    }

    // ========================================================================
    // getTop10FromPattern (baseRound-1 기준으로 예측 생성)
    // ========================================================================
    function getTop10FromPattern(baseRound, startRound, minMatch, topN = 30, excludeBonus = false, sortMode = 'high') {
        const prev = getWinning(baseRound - 1);
        if (!prev) return [];
        const baseNums = prev.main;
        const baseBonus = prev.bonus;
        const similarRounds = [];

        for (const row of DATA) {
            const r = row[0];
            if (r >= baseRound || r < startRound) continue;
            const nums = row.slice(1, 7);
            const bonus = row[7];
            let matchCount = nums.filter(n => baseNums.includes(n)).length;
            if (!excludeBonus && bonus === baseBonus) matchCount += 1;
            if (matchCount >= minMatch) {
                similarRounds.push({ round: r, matchCount });
            }
        }

        similarRounds.sort((a, b) => {
            if (sortMode === 'low') {
                if (a.matchCount !== b.matchCount) return a.matchCount - b.matchCount;
            } else {
                if (b.matchCount !== a.matchCount) return b.matchCount - a.matchCount;
            }
            return b.round - a.round;
        });

        const freqMap = {};
        const starMap = {};
        const bonusMap = {};

        for (const s of similarRounds.slice(0, topN)) {
            const next = getWinning(s.round + 1);
            if (!next) continue;

            const recency = baseRound - s.round;
            let weight = 1.0;
            if (recency <= 10) weight = 1.5;
            else if (recency <= 20) weight = 1.2;
            else weight = 0.8;

            for (const n of next.main) {
                freqMap[n] = (freqMap[n] || 0) + weight;
                starMap[n] = true;
            }
            if (next.bonus !== null && !excludeBonus) {
                freqMap[next.bonus] = (freqMap[next.bonus] || 0) + weight * 0.8;
                bonusMap[next.bonus] = true;
            }
        }

        const scored = Object.entries(freqMap).map(([num, freq]) => {
            let score = freq;
            if (starMap[num]) score += 2.0;
            if (bonusMap[num]) score += 1.0;
            return {
                num: parseInt(num),
                score: Math.round(score * 10) / 10,
                freq: Math.round(freq * 10) / 10,
                isStar: starMap[num] || false,
                isBonus: bonusMap[num] || false
            };
        });

        scored.sort((a, b) => b.score - a.score || b.freq - a.freq);
        return scored.slice(0, 10);
    }

    function getStrongCandidates(nine, subNine, five, prevBonus, pastFreq, prevNineTop, topPredTop5 = [], topN = 7) {
        const candidateSet = new Set([...nine, ...subNine]);
        const results = [];

            }
        }
        const prevTopSet = new Set(prevNineTop || []);
        const topPredSet = new Set(topPredTop5 || []);
        candidateSet.forEach(num => {
            let score = 0;
            const n9 = nine.includes(num);
            const s9 = subNine.includes(num);
            const f5 = five.includes(num);
            if (s9) score += 8;
            if (n9 && s9) score += 5;
            if (f5) score += 3;
            if (!n9 && s9) score += 10;
            if (aroundPrevBonus.includes(num)) score += 2;
            if (pastFreq[num]) score += pastFreq[num] * 2;
            if (prevTopSet.has(num)) score += 2;
            if (topPredSet.has(num)) score += 25;
            results.push({ num: num, score: score });
        });
        results.sort((a, b) => b.score - a.score);
        return results.slice(0, topN);
    }

                });

                const simFreqMap = {};

                const candSet = new Set([...finalPool3, ...pool4]);

                selected9.sort((a,b)=>a-b);
                const nums9 = selected9;
                const hit9 = nums9.filter(n => winMain.includes(n)).length;

                const bScore = {};
                simResult.similar.forEach(s => {
                    if (s.bonus !== null) {
                        let w = 1.0 + s.matchCount * 0.3;
                        const r = round - s.round;
                        if (r <= 10) w *= 1.5; else if (r <= 20) w *= 1.2; else w *= 0.8;
                        bScore[s.bonus] = (bScore[s.bonus] || 0) + w;
                    }
                    if (s.nextBonus !== null) {
                        let w = 1.0 + s.matchCount * 0.2;
                        const r = round - s.round;
                        if (r <= 10) w *= 1.3; else if (r <= 20) w *= 1.1; else w *= 0.9;
                        bScore[s.nextBonus] = (bScore[s.nextBonus] || 0) + w;
                    }
                });
                Object.keys(bScore).forEach(num => {
                    const n = parseInt(num);
                    if (pool5.includes(n)) bScore[n] += 2;
                });
                const bSorted = Object.entries(bScore).sort((a,b) => b[1] - a[1]).map(([num]) => parseInt(num));
                const bonusTop9 = bSorted.slice(0, 9).sort((a,b)=>a-b);
                const hitBonus9 = bonusTop9.filter(n => winMain.includes(n)).length;

                const unionSet = new Set([...nums9, ...bonusTop9]);
                const unionCandidates = Array.from(unionSet);
                const unionScore = {};
                unionCandidates.forEach(num => {
                    unionScore[num] = (scoreMap[num] || 0) * 1.5 + (bScore[num] || 0) * 0.5;
                });
                const unionSorted = Object.entries(unionScore).sort((a,b) => b[1] - a[1]).map(([num]) => parseInt(num));
                const unionTop9 = unionSorted.slice(0, 9).sort((a,b)=>a-b);
                const hitUnion9 = unionTop9.filter(n => winMain.includes(n)).length;

                results.push({ round, win: winMain, bonus: winBonus, nums9, hit9, bonusTop9, hitBonus9, unionTop9, hitUnion9 });
                if (hit9 > max9) max9 = hit9;
                prevBonus = winBonus;
                prevNineTop = nums9.slice(0, 3);
                total9 += hit9;
                totalBonus9 += hitBonus9;
                totalUnion9 += hitUnion9;
            }

            const totalRounds = results.length;
            const avg9 = (total9 / totalRounds).toFixed(2);
            const avgBonus9 = (totalBonus9 / totalRounds).toFixed(2);
            const avgUnion9 = (totalUnion9 / totalRounds).toFixed(2);

            let tableHtml = `<table><thead><tr><th>회차</th><th>당첨번호</th><th style="color:#2ecc71;">9수</th><th style="color:#9b59b6;">보너스 TOP 9</th><th style="color:#f1c40f;">통합 TOP 9</th></tr></thead><tbody>`;
            results.forEach(r => {
                const winStr = r.win.join(', ') + (r.bonus ? `(${r.bonus}☆)` : '');
                const num9Str = r.nums9.map(n => r.win.includes(n) ? `<span class="hit-num">${n}★</span>` : n).join(' ');
                const bonusStr = r.bonusTop9.map(n => r.win.includes(n) ? `<span class="hit-num">${n}★</span>` : n).join(' ');
                const unionStr = r.unionTop9.map(n => r.win.includes(n) ? `<span class="hit-num">${n}★</span>` : n).join(' ');
                tableHtml += `<tr><td>${r.round}</td><td style="color:#ffd700;">${winStr}</td><td>${num9Str} (${r.hit9})</td><td>${bonusStr} (${r.hitBonus9})</td><td>${unionStr} (${r.hitUnion9})</td></tr>`;
            });
            tableHtml += `</tbody></table>`;

            const summaryHtml = `<div class="summary-box">
                <div class="summary-item"><div class="value">${totalRounds}</div><div class="label">📊 분석 회차</div></div>
                <div class="summary-item"><div class="value">${avg9}</div><div class="label">🎯 9수 평균</div></div>
                <div class="summary-item"><div class="value">${avgBonus9}</div><div class="label">🎯 보너스 TOP 9</div></div>
                <div class="summary-item"><div class="value">${avgUnion9}</div><div class="label">🎯 통합 TOP 9</div></div>
                <div class="summary-item"><div class="value">${max9}</div><div class="label">🏆 최대 적중</div></div>
            </div>`;

            resultDiv.innerHTML = tableHtml + summaryHtml;
        }, 100);
    }

    function runManualTest() {
        const round = parseInt(document.getElementById('manualRound').value) || 1234;
        document.getElementById('baseRound').value = round;
        console.log(`🔍 수동 테스트 실행: 기준 회차를 ${round}회로 설정하고 분석 시작`);
        runAnalysis();
    }

    function resetAll() {
        document.getElementById('resultArea').innerHTML = '<div class="loading">🟢 초기화 완료! "🚀 분석 실행" 버튼을 눌러주세요.</div>';
        similarData = null; winData = null; activeFreq2 = []; lastTop9 = [];
        console.log('🗑️ 초기화 완료');
    }

    document.getElementById('topCount').addEventListener('input', function() {
        document.getElementById('topCountDisplay').textContent = this.value;
    });

    window.onload = function() {
        console.log('🟢 로드 완료 (예상 회차 모드)');
        const baseVal = checkFutureData(1234);
        if (!document.getElementById('baseRound').value || document.getElementById('baseRound').value === '') {
            document.getElementById('baseRound').value = baseVal;
        }
        document.getElementById('startRound').value = 1000;
        document.getElementById('topCount').value = 10;
        document.getElementById('topCountDisplay').textContent = 10;
        document.getElementById('excludeBonus').checked = true;
        document.getElementById('resultArea').innerHTML = '<div class="loading">🟢 준비 완료! "🚀 분석 실행" 버튼을 눌러주세요.</div>';
    };
    </script>
