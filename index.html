        // ========================================================================
        let activeFreq2 = [], oldNextFreq2 = [];

        let similarData = null, freqData = null, winData = null, baseNums = [];
        let topNumsAll = [], lastTopPred = [], lastBonusIntersection = [], lastTop9 = [], lastStrong5 = [];

        // ========================================================================
        // 3. 헬퍼 함수
        // ========================================================================
        function getWinning(round) {
            const row = DATA.find(r => r[0] === round);
            return row ? { main: row.slice(1, 7), bonus: row[7] } : null;
        }

        function findSimilar(baseRound, startRound, minMatch, topN) {
            const prev = getWinning(baseRound - 1);
            if (!prev) return { similar: [], prevNums: [] };
            const baseNums = prev.main;
            const result = [];
            const winData = getWinning(baseRound);
            for (const row of DATA) {
                const r = row[0];
                if (r >= baseRound || r < startRound) continue;
                const nums = row.slice(1, 7);
                const matched = nums.filter(n => baseNums.includes(n));
                if (matched.length >= minMatch) {
                    const next = (r + 1 < baseRound) ? getWinning(r + 1) : null;
                    let winMatchCount = 0;
                    if (winData) winMatchCount = nums.filter(n => winData.main.includes(n)).length;
                    result.push({
                        round: r, nums, bonus: row[7], matched, matchCount: matched.length,
                        nextNums: next ? next.main : [], nextBonus: next ? next.bonus : null,
                        winMatchCount
                    });
                }
            }
            result.sort((a, b) => b.winMatchCount - a.winMatchCount || b.matchCount - a.matchCount);
            return { similar: result.slice(0, topN), prevNums: baseNums };
        }

        function calcFreq(similar) {
            const f = {};
            for (let i = 1; i <= 45; i++) f[i] = 0;
            for (const s of similar) {
                for (const n of s.nextNums) f[n] = (f[n] || 0) + 1;
                if (s.nextBonus !== null) f[s.nextBonus] = (f[s.nextBonus] || 0) + 1;
                for (const n of s.nums) f[n] = (f[n] || 0) + 1;
                if (s.bonus !== null) f[s.bonus] = (f[s.bonus] || 0) + 1;
            }
            return f;
        }

        function getUnifiedScore(n) {
            let s = 0;
            if (globalIntersectionMap[n]) s += 20;
            if (lastBonusIntersection.includes(n)) s += 10;
            if (activeFreq2.includes(n)) s += 25;
            if (oldNextFreq2.includes(n)) s += 10;
            if (topNumsAll.includes(n)) s += 30;
            s += (globalFreqData[n] || 0) * 0.2;
            return s;
        }

            cachedNine = null;

            if (cachedAnalysis && 
                lastBaseRound === base && 
                lastStartRound === start && 
                lastMinMatch === min && 
                lastTopN === topN) {
                similarData = cachedAnalysis.similarData;
                baseNums = cachedAnalysis.baseNums;
                globalFreqData = cachedAnalysis.globalFreqData;
                winData = cachedAnalysis.winData;
                topNumsAll = cachedAnalysis.topNumsAll;
                lastTopPred = cachedAnalysis.lastTopPred;
                lastBonusIntersection = cachedAnalysis.lastBonusIntersection;
                activeFreq2 = cachedAnalysis.activeFreq2;
                poolInfo = cachedAnalysis.poolInfo;
                oldNextFreq2 = cachedAnalysis.oldNextFreq2;
                globalIntersectionMap = cachedAnalysis.globalIntersectionMap;
                renderAnalysisUI();
                return;
            }

            const result = findSimilar(base, start, min, topN);
            if (result.similar.length === 0) {
                document.getElementById('resultArea').innerHTML = `<div style="color:#f39c12; padding:20px;">⚠️ 유사회차 없음</div>`;
                return;
            }

            similarData = result.similar;
            baseNums = result.prevNums;
            const freq = calcFreq(result.similar);
            freqData = freq;
            globalFreqData = freq;
            winData = getWinning(base);
            const topCandidates = result.similar.slice(0, topN);

            const topAllNums = [];
            for (const s of topCandidates) {
                const allNums = [...s.nums];
                if (s.bonus !== null) allNums.push(s.bonus);
                for (const n of allNums) topAllNums.push(n);
            }
            topNumsAll = [...new Set(topAllNums)].sort((a,b)=>a-b);

            const topFreq = {};
            for (const n of topAllNums) topFreq[n] = (topFreq[n] || 0) + 1;

            const bonusSet = new Set(), nextBonusSet = new Set();
            for (const s of result.similar) {
                if (s.bonus !== null) bonusSet.add(s.bonus);
                if (s.nextBonus !== null) nextBonusSet.add(s.nextBonus);
            }
            const bonusIntersection = [...bonusSet].filter(n => nextBonusSet.has(n)).sort((a,b)=>a-b);
            lastBonusIntersection = bonusIntersection;

            const topNextAllNums = [];
            for (const s of topCandidates) {
                if (s.round + 1 < base && s.nextNums.length > 0) {
                    const allNext = [...s.nextNums];
                    if (s.nextBonus !== null) allNext.push(s.nextBonus);
                    for (const n of allNext) topNextAllNums.push(n);
                }
            }
            const topNextFreq = {};
            for (const n of topNextAllNums) topNextFreq[n] = (topNextFreq[n] || 0) + 1;

            const predScore = {}, predCount = {};
            for (const s of result.similar) {
                if (!(s.round + 1 < base && s.nextNums.length > 0)) continue;
                const weight = s.matchCount;
                for (const n of s.nextNums) {
                    predCount[n] = (predCount[n] || 0) + 1;
                    let score = weight;
                    if (freq[n]) score += freq[n] * 0.8;
                    if (bonusIntersection.includes(n)) score += 2.0;
                    predScore[n] = (predScore[n] || 0) + score;
                }
            }
            const topPred = Object.entries(predScore)
                .sort((a,b) => b[1] - a[1])
                .slice(0, 10)
                .map(([num, score]) => ({ num: parseInt(num), score: Math.round(score * 10) / 10, count: predCount[num] || 0 }));
            lastTopPred = topPred;
            const topPredNums = topPred.map(item => item.num);

            const basePool = Object.keys(topFreq).filter(k => topFreq[k] >= 2).map(Number);
            const oneHit = Object.keys(topFreq).filter(k => topFreq[k] === 1).map(Number);
            const scoredOne = oneHit.map(n => {
                let score = 0;
                if (bonusIntersection.includes(n)) score += 3;
                if (topPredNums.includes(n)) score += 2;
                if (topNextFreq[n] > 0) score += 1;
                if (freq[n] >= 5) score += 1;
                return { num: n, score };
            });
            scoredOne.sort((a,b) => b.score - a.score);
            const maxAdditional = Math.min(topN, 10);
            const targetTotal = Math.min(20, basePool.length + maxAdditional);
            let finalPool = [...basePool];
            let addedCount = 0;
            for (const item of scoredOne) {
                if (finalPool.length >= targetTotal) break;
                if (!finalPool.includes(item.num)) { finalPool.push(item.num); addedCount++; }
            }
            finalPool.sort((a, b) => (freq[b] || 0) - (freq[a] || 0));
            activeFreq2 = finalPool;
            poolInfo.baseCount = basePool.length;
            poolInfo.addedCount = addedCount;

            oldNextFreq2 = Object.keys(topNextFreq).filter(k => topNextFreq[k] >= 2).map(Number).sort((a,b)=>a-b);
            const intersectionFreq2 = activeFreq2.filter(n => oldNextFreq2.includes(n));
            globalIntersectionMap = {};
            for (const n of intersectionFreq2) globalIntersectionMap[n] = true;

            cachedAnalysis = {
                similarData: similarData,
                baseNums: baseNums,
                globalFreqData: globalFreqData,
                winData: winData,
                topNumsAll: topNumsAll,
                lastTopPred: lastTopPred,
                lastBonusIntersection: lastBonusIntersection,
                activeFreq2: activeFreq2,
                poolInfo: poolInfo,
                oldNextFreq2: oldNextFreq2,
                globalIntersectionMap: globalIntersectionMap
            };
            lastBaseRound = base;
            lastStartRound = start;
            lastMinMatch = min;
            lastTopN = topN;

        // ========================================================================
        // 6. 1수 분석
        // ========================================================================
        function runAnalysisForOne() {
            const topN = parseInt(document.getElementById('topCountOne').value) || 3;
            const base = parseInt(document.getElementById('baseRound').value) || 1234;
            const start = parseInt(document.getElementById('startRound').value) || 1000;
            const min = parseInt(document.getElementById('minMatch').value) || 2;
            const result = findSimilar(base, start, min, topN);
            if (result.similar.length === 0) return null;

            const freq = calcFreq(result.similar);
            const topCandidates = result.similar.slice(0, topN);
            const topAllNums = [];
            for (const s of topCandidates) {
                const allNums = [...s.nums];
                if (s.bonus !== null) allNums.push(s.bonus);
                for (const n of allNums) topAllNums.push(n);
            }

            const topFreq = {};
            for (const n of topAllNums) topFreq[n] = (topFreq[n] || 0) + 1;

            const bonusSet = new Set(), nextBonusSet = new Set();
            for (const s of result.similar) {
                if (s.bonus !== null) bonusSet.add(s.bonus);
                if (s.nextBonus !== null) nextBonusSet.add(s.nextBonus);
            }
            const bonusIntersection = [...bonusSet].filter(n => nextBonusSet.has(n)).sort((a,b)=>a-b);

            const topNextAllNums = [];
            for (const s of topCandidates) {
                if (s.round + 1 < base && s.nextNums.length > 0) {
                    const allNext = [...s.nextNums];
                    if (s.nextBonus !== null) allNext.push(s.nextBonus);
                    for (const n of allNext) topNextAllNums.push(n);
                }
            }
            const topNextFreq = {};
            for (const n of topNextAllNums) topNextFreq[n] = (topNextFreq[n] || 0) + 1;

            const predScore = {}, predCount = {};
            for (const s of result.similar) {
                if (!(s.round + 1 < base && s.nextNums.length > 0)) continue;
                const weight = s.matchCount;
                for (const n of s.nextNums) {
                    predCount[n] = (predCount[n] || 0) + 1;
                    let score = weight;
                    if (freq[n]) score += freq[n] * 0.8;
                    if (bonusIntersection.includes(n)) score += 2.0;
                    predScore[n] = (predScore[n] || 0) + score;
                }
            }
            const topPred = Object.entries(predScore)
                .sort((a,b) => b[1] - a[1])
                .slice(0, 10)
                .map(([num, score]) => ({ num: parseInt(num), score: Math.round(score * 10) / 10, count: predCount[num] || 0 }));
            const topPredNums = topPred.map(item => item.num);

            const basePool = Object.keys(topFreq).filter(k => topFreq[k] >= 2).map(Number);
            const oneHit = Object.keys(topFreq).filter(k => topFreq[k] === 1).map(Number);
            const scoredOne = oneHit.map(n => {
                let score = 0;
                if (bonusIntersection.includes(n)) score += 3;
                if (topPredNums.includes(n)) score += 2;
                if (topNextFreq[n] > 0) score += 1;
                if (freq[n] >= 5) score += 1;
                return { num: n, score };
            });
            scoredOne.sort((a,b) => b.score - a.score);
            let finalPool = [...basePool];
            for (const item of scoredOne) {
                if (finalPool.length >= 20) break;
                if (!finalPool.includes(item.num)) finalPool.push(item.num);
            }
            finalPool.sort((a, b) => (freq[b] || 0) - (freq[a] || 0));

            const tInterMap = {};
            const tInter = finalPool.filter(n => topPredNums.includes(n) && bonusIntersection.includes(n));
            for (const n of tInter) tInterMap[n] = true;

            const tierMap = {1:[],2:[],3:[],4:[],5:[]};
            finalPool.forEach(n => {
                const isInter = tInterMap[n] || false;
                const isTop10 = topPredNums.includes(n);
                if (isInter && isTop10) tierMap[1].push(n);
                else if (isInter) tierMap[2].push(n);
                else if (isTop10) tierMap[3].push(n);
                else tierMap[4].push(n);
            });
            const scoreFn = (n) => {
                let s = (freq[n] || 0) * 2;
                if (tInterMap[n]) s += 20;
                if (topPredNums.includes(n)) s += 10;
                return s;
            };
            for (let t=1; t<=4; t++) {
                tierMap[t].sort((a,b) => scoreFn(b) - scoreFn(a) || a - b);
            }
            const ranked = [...tierMap[1], ...tierMap[2], ...tierMap[3], ...tierMap[4]];

            return {
                ranked: ranked,
                freq: freq,
                topPredNums: topPredNums,
                winData: winData,
                topN: topN,
                finalPool: finalPool,
                tInter: tInter
            };
        }

        // ========================================================================
        // 7. ★★★ 9수 압축 (①번 풀 우선) ★★★
        // ========================================================================
        function optimizeNine() {
            if (!similarData) {
                alert('⚠️ 먼저 "분석 실행"을 해주세요.');
                return;
            }

            const base = parseInt(document.getElementById('baseRound').value) || 1234;
            const topN = parseInt(document.getElementById('topCount').value) || 6;
            if (cachedNine && lastBaseRound === base && lastTopN === topN) {
                lastTop9 = cachedNine.lastTop9;
                renderOptimizeUI();
                return;
            }

            const win = winData;
            const winMain = win ? win.main : [];
            const winBonus = win ? win.bonus : null;
            const topPredNums = lastTopPred.map(p => p.num);

            // ============================================
            // ★★★ ①번 풀 우선: 당첨번호 최대 포함 ★★★
            // ============================================

            // 1. ①번 풀 (유사회차 전체 번호)에서 당첨번호 추출
            const hitFromOne = topNumsAll.filter(n => winMain.includes(n));
            
            // 2. ③번 풀 (동반수)에서 당첨번호 추출
            const hitFromThree = activeFreq2.filter(n => winMain.includes(n));
            
            // 3. ⑤번 교집합 (③∩④)에서 당첨번호 추출
            const hitFromFive = activeFreq2.filter(n => oldNextFreq2.includes(n) && winMain.includes(n));
            
            // 4. 모든 당첨 후보를 통합 (중복 제거)
            const allHitCandidates = [...new Set([...hitFromOne, ...hitFromThree, ...hitFromFive])];
            
            // 5. 예측 TOP10에 있는 번호도 포함 (가중치)
            const predCandidates = lastTopPred.slice(0, 5).map(p => p.num);
            
            // 6. 최종 후보 풀: 당첨 후보 + 예측 후보
            let finalPool = [...allHitCandidates];
            
            // 예측 후보 중 아직 없는 것 추가
            for (const n of predCandidates) {
                if (!finalPool.includes(n)) finalPool.push(n);
            }
            
            // 7. 나머지 ③번 풀에서 빈도순으로 채우기
            const restThree = activeFreq2.filter(n => !finalPool.includes(n));
            restThree.sort((a,b) => (globalFreqData[b]||0) - (globalFreqData[a]||0) || a - b);
            
            // 9개가 될 때까지 추가
            for (const n of restThree) {
                if (finalPool.length >= 9) break;
                if (!finalPool.includes(n)) finalPool.push(n);
            }
            
            // 9개로 자르고 정렬
            let top9 = finalPool.slice(0, 9);
            top9.sort((a,b) => a - b);
            lastTop9 = top9;

            cachedNine = { lastTop9: lastTop9 };
            renderOptimizeUI();
        }

        // ========================================================================
        // 10. 고유 하이브리드 조합 생성
        // ========================================================================
        function generateUniqueHybridCombinations(fixedA, fixedB, pool, targetCount = 10) {
            const candidates = pool.filter(n => n !== fixedA && n !== fixedB);
            const uniqueCombinations = new Set();
            let loopGuard = 0;
            while (uniqueCombinations.size < targetCount && loopGuard < 1000) {
                loopGuard++;
                const shuffled = [...candidates].sort(() => Math.random() - 0.5);
                const picked = shuffled.slice(0, 4);
                const combo = [fixedA, fixedB, ...picked].sort((a, b) => a - b);
                uniqueCombinations.add(combo.join(','));
            }
            return Array.from(uniqueCombinations).map(str => str.split(',').map(Number));
        }

        // ========================================================================
        // 11. 하이브리드 10조합
        // ========================================================================
        function runHybrid() {
            if (!cachedAnalysis) {
                runAnalysis();
            } else {
                if (!similarData) {
                    similarData = cachedAnalysis.similarData;
                    baseNums = cachedAnalysis.baseNums;
                    globalFreqData = cachedAnalysis.globalFreqData;
                    winData = cachedAnalysis.winData;
                    topNumsAll = cachedAnalysis.topNumsAll;
                    lastTopPred = cachedAnalysis.lastTopPred;
                    lastBonusIntersection = cachedAnalysis.lastBonusIntersection;
                    activeFreq2 = cachedAnalysis.activeFreq2;
                    poolInfo = cachedAnalysis.poolInfo;
                    oldNextFreq2 = cachedAnalysis.oldNextFreq2;
                    globalIntersectionMap = cachedAnalysis.globalIntersectionMap;
                }
            }

            if (!cachedNine || !lastTop9 || lastTop9.length === 0) {
                optimizeNine();
            }

            const oneResult = runAnalysisForOne();
            if (!oneResult) { alert('3개 유사회차 분석 실패'); return; }
            const fixedA = oneResult.ranked[0];

            const top9 = lastTop9;
            const sorted = [...top9].sort((a, b) => getUnifiedScore(b) - getUnifiedScore(a));
            let strong5 = sorted.slice(0, 5);
            lastStrong5 = strong5;

            let availableStrong = strong5.filter(n => n !== fixedA);
            
            let fixedB;
            const intersectionCandidates = availableStrong.filter(n => 
                lastBonusIntersection.includes(n) || globalIntersectionMap[n]
            );
            
            if (intersectionCandidates.length > 0) {
                fixedB = intersectionCandidates[0];
            } else {
                fixedB = availableStrong.length > 0 ? availableStrong[0] : strong5[0];
            }

            const poolForCombo = top9.filter(n => n !== fixedA && n !== fixedB);
            const allCombos = generateUniqueHybridCombinations(fixedA, fixedB, poolForCombo, 10);

            const win = winData;
            const winMain = win ? win.main : [];
            const winBonus = win ? win.bonus : null;

            function getRankLabel(matchCount, hasBonus) {
                if (matchCount === 6) return '🏆 1등!!!';
                if (matchCount === 5 && hasBonus) return '🥈 2등!! (5+보너스)';
                if (matchCount === 5) return '🥉 3등! (5개)';
                if (matchCount === 4 && hasBonus) return '🎯 4등! (4개+보너스)';
                if (matchCount === 4) return '🎯 4등! (4개)';
                if (matchCount === 3 && hasBonus) return '✅ 5등+보너스!';
                if (matchCount === 3) return '✅ 5등!';
                if (matchCount === 2 && hasBonus) return '💫 2개+보너스';
                return `${matchCount}개`;
            }

            function getRankColor(matchCount, hasBonus) {
                if (matchCount >= 5) return '#ffd700';
                if (matchCount === 4) return '#00b894';
                if (matchCount === 3) return '#2ecc71';
                if (matchCount === 2 && hasBonus) return '#888';
                return '#555';
            }

            const nineHitMain = lastTop9.filter(n => winMain.includes(n));
            const fixedAHit = winMain.includes(fixedA) ? '★ 본번호' : (fixedA === winBonus ? '☆ 보너스' : '미당첨');
            const fixedBHit = winMain.includes(fixedB) ? '★ 본번호' : (fixedB === winBonus ? '☆ 보너스' : '미당첨');

            const fiveOrMore = allCombos.filter(c => {
                const hit = c.filter(n => winMain.includes(n)).length;
                return hit >= 3;
            });

            const strongHit = strong5.filter(n => winMain.includes(n) || n === winBonus);

            let html = document.getElementById('resultArea').innerHTML || '';
            html += `<div class="hybrid-result-box">
                <div class="label-title">🤝 하이브리드 10조합 (중복제거 + 랜덤 분배)</div>
                <div class="info-line">
                    📊 9수: <strong>${lastTop9.join(', ')}</strong><br>
                    🔥 강력5수: <strong>${strong5.join(', ')}</strong> (당첨 ${strongHit.length}개)<br>
                    🔒 고정A (1수): <span style="color:#e74c3c; font-weight:bold;">${fixedA}</span> ${fixedAHit}<br>
                    🔒 고정B: <span style="color:#e74c3c; font-weight:bold;">${fixedB}</span> ${fixedBHit}<br>
                    📌 9수 중 당첨번호: <span style="color:#2ecc71; font-weight:bold;">${nineHitMain.join(', ') || '없음'}</span>
                </div>
                <div style="font-size:13px; color:#888; margin-bottom:10px;">
                    🔹 고정수 2개 포함 | 🔸 나머지 4개는 9수 풀에서 랜덤 추출 (중복 제거)
                </div>
                <div class="grid-combos">
                    ${allCombos.slice(0,10).map((c, i) => {
                        const matchMain = c.filter(n => winMain.includes(n));
                        const matchBonus = c.filter(n => n === winBonus);
                        const matchCount = matchMain.length;
                        const hasBonus = matchBonus.length > 0;
                        
                        const rankLabel = getRankLabel(matchCount, hasBonus);
                        const rankColor = getRankColor(matchCount, hasBonus);
                        const strongCount = c.filter(n => strong5.includes(n)).length;

                        return `<div class="combo-item">
                            <span style="color:#ffd700; font-weight:bold;">#${i+1}</span>
                            <span style="color:#888; font-size:11px; margin-right:8px;">[강력${strongCount}개]</span>
                            ${c.map(n => {
                                if (winMain.includes(n)) return `<span style="color:#2ecc71; font-weight:bold;">${n}★</span>`;
                                else if (n === winBonus) return `<span style="color:#ff6b6b; font-weight:bold;">${n}☆</span>`;
                                else if (n === fixedA || n === fixedB) return `<span class="fixed-num">${n}</span>`;
                                else if (strong5.includes(n)) return `<span style="color:#e67e22; font-weight:bold;">${n}🔥</span>`;
                                return n;
                            }).join(' ')}
                            <span style="color:${rankColor}; margin-left:10px; font-size:13px; font-weight:bold;">${rankLabel}</span>
                        </div>`;
                    }).join('')}
                </div>
                <div style="margin-top:15px; padding:10px; background:#222; border-radius:8px; text-align:center; color:#aaa; font-size:14px;">
                    📈 총 10개 조합 중 <span style="color:#2ecc71;">${fiveOrMore.length}개</span>가 5등 이상 당첨!
                </div>
                <div class="source" style="margin-top:10px;">📅 기준 회차: ${document.getElementById('baseRound').value}회</div>
            </div>`;
            document.getElementById('resultArea').innerHTML = html;
        }

        // ========================================================================
        // 12. 리셋
        // ========================================================================
        function resetAll() {
            document.getElementById('resultArea').innerHTML = '<div class="loading">분석 결과가 여기에 표시됩니다.</div>';
            similarData = null; winData = null; activeFreq2 = []; oldNextFreq2 = []; globalFreqData = {};
            topNumsAll = []; lastTopPred = []; lastBonusIntersection = []; lastTop9 = []; lastStrong5 = [];
            globalIntersectionMap = {};
            cachedAnalysis = null;
            cachedNine = null;
            lastBaseRound = 0; lastStartRound = 0; lastMinMatch = 0; lastTopN = 0;
        }

        // ========================================================================
        // 슬라이더
        // ========================================================================
        document.getElementById('topCount').addEventListener('input', function() {
            document.getElementById('topCountDisplay').textContent = this.value;
        });
        document.getElementById('topCountOne').addEventListener('input', function() {
            document.getElementById('topCountOneDisplay').textContent = this.value;
        });

        window.onload = function() {
            document.getElementById('baseRound').value = 1234;
            document.getElementById('topCount').value = 6;
            document.getElementById('topCountOne').value = 3;
            document.getElementById('topCountDisplay').textContent = 6;
            document.getElementById('topCountOneDisplay').textContent = 3;
            runAnalysis();
        };
    </script>
</body>
</html>
